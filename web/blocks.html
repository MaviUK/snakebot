<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#23453d">
<title>BLOCKS | Retro Pocket Puzzle</title>
<style>
:root{--phone:#355d54;--phone-dark:#183b35;--phone-light:#6b8f86;--screen:#9cad6c;--pixel:#24351f;--screen-edge:#172d29}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#101615;font-family:Arial,Helvetica,sans-serif;color:#fff;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;padding:16px 12px}
.wrap{width:min(94vw,430px)}
.phone{position:relative;background:linear-gradient(145deg,var(--phone-light),var(--phone) 40%,var(--phone-dark));border-radius:42px 42px 58px 58px;padding:28px 25px 29px;box-shadow:0 20px 60px #0009,inset 0 0 0 3px #88a79f22,inset 0 -10px 22px #0003;border:2px solid #75958d66}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px;color:#e8f0e8;font-weight:800;letter-spacing:.19em;font-size:13px;text-shadow:0 1px #000}
.speaker{width:38px;height:5px;border-radius:999px;background:#122e29;box-shadow:inset 0 1px 1px #0008}
.screen-shell{background:var(--screen-edge);padding:12px;border-radius:14px 14px 28px 28px;box-shadow:inset 0 0 12px #000b,0 2px 1px #9bb7af44}
.screen{position:relative;overflow:hidden;background:var(--screen);border:3px solid #566846;box-shadow:inset 0 0 22px #4f603c55;image-rendering:pixelated}
.screen.effect-clear{background:#becb91}.screen.effect-tetris{background:#d4d99a}
.screen-hud{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:7px 8px 6px;color:var(--pixel);font-family:monospace;font-weight:900;font-size:clamp(9px,2.7vw,11px);white-space:nowrap;text-shadow:0 1px #c7d29a66}
.screen-effect{min-height:18px;padding:3px 8px 4px;border-top:1px solid #566846;border-bottom:2px solid #566846;color:var(--pixel);font-family:monospace;font-weight:900;font-size:10px;text-align:center;letter-spacing:.03em}
.board-area{position:relative;aspect-ratio:1/1;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#9cad6cf1;color:var(--pixel);font-family:monospace;font-weight:900;text-align:center;padding:12px;z-index:2;pointer-events:none}
.overlay.hidden{display:none}.overlay .big{font-size:23px;letter-spacing:.05em;margin-bottom:8px}.overlay .small{font-size:12px;line-height:1.55}
.direction-wrap{display:flex;justify-content:center;padding-top:20px;padding-bottom:6px}
.direction-pad{position:relative;width:200px;height:166px}
.dir-key{position:absolute;border:1px solid #79968f66;background:linear-gradient(#52776e,#25443e);box-shadow:inset 0 2px 1px #fff2,0 4px 6px #0007;color:#eef5ef;font-size:21px;font-weight:900;transition:transform .045s ease,box-shadow .045s ease,filter .045s ease;z-index:1;touch-action:none}
.dir-key.up,.dir-key.down{left:70px;width:60px;height:46px}.dir-key.up{top:0;border-radius:30px 30px 12px 12px}.dir-key.down{bottom:0;border-radius:12px 12px 30px 30px}
.dir-key.left,.dir-key.right{top:55px;width:62px;height:56px}.dir-key.left{left:0;border-radius:30px 12px 12px 30px}.dir-key.right{right:0;border-radius:12px 30px 30px 12px}
.dir-key.center{left:70px;top:55px;width:60px;height:56px;border-radius:50%;font-size:10px;letter-spacing:.06em;background:linear-gradient(#78968f,#35564f);z-index:2}
.dir-key.pressed{transform:translateY(3px) scale(.97);box-shadow:inset 0 3px 6px #0009,0 1px 2px #0005;filter:brightness(.82)}
button{font:inherit;color:#eef5ef;user-select:none;cursor:pointer}
.lcd-menu{position:absolute;inset:0;background:#9cad6cf8;color:var(--pixel);z-index:6;padding:12px;font-family:monospace;display:flex;flex-direction:column;min-height:0}
.lcd-menu.hidden{display:none}
.menu-title{font-weight:900;font-size:15px;text-align:center;border-bottom:2px solid #566846;padding:2px 0 8px;margin-bottom:8px}
.menu-actions{display:grid;grid-auto-rows:max-content;align-content:start;gap:6px;overflow:auto;min-height:0}
.menu-btn{width:100%;border:2px solid #566846;background:#9cad6c;color:var(--pixel);padding:8px 7px;font-family:monospace;font-weight:900;font-size:11px;text-align:left;border-radius:2px;min-height:30px;line-height:1.15}
.menu-btn:active{background:#7f9259}.menu-sub{font-size:9px;line-height:1.25;opacity:.8;margin-top:3px}.menu-footer{font-size:9px;text-align:center;margin-top:6px;font-weight:900;min-height:10px}
.leaderboard{display:grid;gap:4px;overflow-y:auto;min-height:0;flex:1;padding-right:2px;align-content:start}
.leader-row{display:grid;grid-template-columns:22px 1fr 45px 66px;gap:4px;align-items:center;font-size:9px;border-bottom:1px solid #566846;padding:3px 0}
.leader-row.head,.leader-row.you{font-weight:900;border-bottom:2px solid #566846}
.menu-back{margin-top:7px;flex-shrink:0}
@media(max-height:760px){body{align-items:flex-start}.phone{padding-top:18px;padding-bottom:20px}}
@media(max-width:350px){.phone{padding:20px 16px 22px;border-radius:34px 34px 46px 46px}.screen-shell{padding:9px}.direction-wrap{padding-top:14px}}
</style>
</head>
<body>
<main class="wrap">
<section class="phone" aria-label="Retro automatic falling-block puzzle game">
  <div class="brand"><span class="speaker"></span><span>BLOCKS</span><span class="speaker"></span></div>
  <div class="screen-shell"><div id="screen" class="screen">
    <div class="screen-hud"><span id="screenLevel">LEVEL 01</span><span id="screenPoints">POINTS 000000</span></div>
    <div id="screenEffect" class="screen-effect">AUTO PLAY</div>
    <div id="boardArea" class="board-area">
      <canvas id="game" width="288" height="288" aria-label="Falling blocks playfield"></canvas>
      <div id="overlay" class="overlay hidden" aria-live="polite"></div>
    </div>
    <div id="lcdMenu" class="lcd-menu hidden" aria-label="Pause menu"></div>
  </div></div>
  <div class="direction-wrap"><div class="direction-pad" aria-label="Game controls">
    <button type="button" class="dir-key up" id="dirUp" aria-label="Rotate block">▲</button>
    <button type="button" class="dir-key left" id="dirLeft" aria-label="Move left">◀</button>
    <button type="button" class="dir-key center" id="menuBtn" aria-label="Pause and open menu">MENU</button>
    <button type="button" class="dir-key right" id="dirRight" aria-label="Move right">▶</button>
    <button type="button" class="dir-key down" id="dirDown" aria-label="Move down">▼</button>
  </div></div>
</section>
</main>
<script>
(() => {
'use strict';
const C=10,R=20,S=14,BX=17,BY=4,W=288,H=288;
const LCD='#9cad6c',INK='#24351f',LIGHT='#b2c283',FADE='#82945c';
const $=id=>document.getElementById(id);
const canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false}); ctx.imageSmoothingEnabled=false;
const screen=$('screen'),effect=$('screenEffect'),menu=$('lcdMenu'),overlay=$('overlay');
const buttons={up:$('dirUp'),down:$('dirDown'),left:$('dirLeft'),right:$('dirRight')};
const SHAPES={
  I:[[0,1],[1,1],[2,1],[3,1]],
  O:[[1,0],[2,0],[1,1],[2,1]],
  T:[[1,0],[0,1],[1,1],[2,1]],
  S:[[1,0],[2,0],[0,1],[1,1]],
  Z:[[0,0],[1,0],[1,1],[2,1]],
  J:[[0,0],[0,1],[1,1],[2,1]],
  L:[[2,0],[0,1],[1,1],[2,1]]
};
const TYPES=Object.keys(SHAPES);
function normalise(cells){const minX=Math.min(...cells.map(p=>p[0])),minY=Math.min(...cells.map(p=>p[1]));return cells.map(([x,y])=>[x-minX,y-minY]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);}
function rotate(cells){return normalise(cells.map(([x,y])=>[3-y,x]));}
const ROT={};for(const t of TYPES){const found=[],seen=new Set();let cur=normalise(SHAPES[t]);for(let i=0;i<4;i++){const key=JSON.stringify(cur);if(!seen.has(key)){seen.add(key);found.push({cells:cur,w:Math.max(...cur.map(c=>c[0]))+1,h:Math.max(...cur.map(c=>c[1]))+1});}cur=rotate(cur);}ROT[t]=found;}
const SAVE='retroBlocks3310SaveV1',BEST='retroBlocks3310BestV1',SOUND='retroBlocks3310SoundV1';
let board=[],bag=[],queue=[],active=null,plan=null,level=1,score=0,lines=0,best={score:0,level:1,lines:0};
let auto=true,soundOn=false,running=true,gameOver=false,menuOpen=false,menuView='main',tickCount=0,clearFlash=0,clearText='',highlightTimeout=null,repeatTimer=null,audio=null,gravityCounter=0,closingTimer=null;
function emptyBoard(){return Array.from({length:R},()=>Array(C).fill(null));}
function numeric(n){return Math.max(0,Math.floor(n||0));}
function safeRead(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch{return null;}}
function put(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch{}}
function updateBest(){if(score>best.score){best={score,level,lines};put(BEST,best);}}
function shuffle(array){for(let i=array.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[array[i],array[j]]=[array[j],array[i]];}return array;}
function drawFromBag(){if(!bag.length)bag=shuffle([...TYPES]);return bag.pop();}
function replenish(){while(queue.length<4)queue.push(drawFromBag());}
function collides(matrix,shape,x,y){for(const [cx,cy] of shape.cells){const xx=x+cx,yy=y+cy;if(xx<0||xx>=C||yy>=R)return true;if(yy>=0&&matrix[yy][xx])return true;}return false;}
function simulate(matrix,shape,x){let y=-shape.h;while(!collides(matrix,shape,x,y+1))y++;
  if(shape.cells.some(([cx,cy])=>y+cy<0))return null;
  const next=matrix.map(row=>row.slice());for(const [cx,cy] of shape.cells)next[y+cy][x+cx]=1;
  let removed=0;for(let row=R-1;row>=0;row--){if(next[row].every(Boolean)){next.splice(row,1);next.unshift(Array(C).fill(null));removed++;row++;}}
  return {board:next,lines:removed,y};
}
function rate(matrix,clears){const heights=[],holes=[];for(let x=0;x<C;x++){let top=R,under=0;for(let y=0;y<R;y++){if(matrix[y][x]){if(top===R)top=y;}else if(top!==R)under++;}heights.push(R-top);holes.push(under);}
  const sum=heights.reduce((a,b)=>a+b,0),totalHoles=holes.reduce((a,b)=>a+b,0),bump=heights.slice(1).reduce((a,h,i)=>a+Math.abs(h-heights[i]),0);
  const highest=Math.max(...heights);
  return -0.51*sum-0.80*totalHoles-0.24*bump+1.35*clears-0.10*highest-(highest>=17?(highest-16)**2*1.8:0);
}
function allPlacements(matrix,type){const result=[];for(let rot=0;rot<ROT[type].length;rot++){const shape=ROT[type][rot];for(let x=0;x<=C-shape.w;x++){const projected=simulate(matrix,shape,x);if(projected)result.push({x,rot,projected});}}return result;}
function choosePlan(){if(!active)return null;const next=queue[0];const first=allPlacements(board,active.type);if(!first.length)return null;
  let winner=null,bestScore=-Infinity;const tie=Math.random()*0.001;
  for(const f of first){const immediate=rate(f.projected.board,f.projected.lines);let future=-250;
    if(next){const placements=allPlacements(f.projected.board,next);for(const p of placements){const v=rate(p.projected.board,p.projected.lines);if(v>future)future=v;}}
    const value=immediate*0.44+future*0.56+f.projected.lines*1.2+tie;
    if(value>bestScore){bestScore=value;winner={x:f.x,rot:f.rot};}
  }
  return winner;
}
function spawn(){replenish();const type=queue.shift();replenish();const shape=ROT[type][0];active={type,rot:0,x:Math.floor((C-shape.w)/2),y:-shape.h};gravityCounter=0;plan=null;
  if(collides(board,shape,active.x,active.y+1)){endGame();return;}
  if(auto)plan=choosePlan();
  saveProgress();
}
function newGame(){if(closingTimer){clearTimeout(closingTimer);closingTimer=null;}board=emptyBoard();bag=[];queue=[];active=null;plan=null;level=1;score=0;lines=0;tickCount=0;clearFlash=0;gameOver=false;running=true;menuOpen=false;gravityCounter=0;auto=auto===false?false:true;overlay.classList.add('hidden');menu.classList.add('hidden');spawn();updateHud();render();saveProgress();}
function endGame(){gameOver=true;running=false;active=null;plan=null;updateBest();saveProgress();showOverlay('GAME OVER',`LEVEL ${level}<br>POINTS ${score.toLocaleString()}<br>${auto?'RESTARTING...':'PRESS MENU TO RESTART'}`);beep(210,0.22);
  if(auto)closingTimer=setTimeout(()=>{closingTimer=null;if(gameOver&&!menuOpen&&auto)newGame();},2700);
}
function shapeOf(p){return ROT[p.type][p.rot];}
function move(dx,dy){if(!active)return false;const s=shapeOf(active);if(collides(board,s,active.x+dx,active.y+dy))return false;active.x+=dx;active.y+=dy;return true;}
function rotateActive(){if(!active||ROT[active.type].length===1)return false;
  const next=(active.rot+1)%ROT[active.type].length,s=ROT[active.type][next];
  for(const kick of [0,-1,1,-2,2]){if(!collides(board,s,active.x+kick,active.y)){active.rot=next;active.x+=kick;return true;}}
  return false;
}
function lockPiece(){if(!active)return;const s=shapeOf(active);let above=false;for(const [cx,cy] of s.cells){const y=active.y+cy;if(y<0){above=true;continue;}board[y][active.x+cx]=active.type;}
  if(above){endGame();return;}
  let removed=0;for(let y=R-1;y>=0;y--){if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(C).fill(null));removed++;y++;}}
  if(removed){lines+=removed;score+=([0,100,300,500,800][removed]||800)*level;level=1+Math.floor(lines/10);clearFlash=removed===4?8:5;clearText=removed===4?'4 LINES!':removed===3?'TRIPLE!':removed===2?'DOUBLE!':'LINE CLEAR!';beep(removed===4?800:540,0.1);
  }else{score+=5;}
  updateBest();spawn();updateHud();
}
function levelTickRate(){return Math.max(1,Math.round(12*Math.pow(0.86,level-1)));}
function manualTick(){gravityCounter++;if(gravityCounter>=levelTickRate()){gravityCounter=0;if(!move(0,1))lockPiece();}}
function glowDirection(dir){if(!buttons[dir])return;for(const b of Object.values(buttons))b.classList.remove('pressed');buttons[dir].classList.add('pressed');clearTimeout(highlightTimeout);highlightTimeout=setTimeout(()=>buttons[dir].classList.remove('pressed'),100);}
function autoTick(){if(!active)return;if(!plan){plan=choosePlan();if(!plan){endGame();return;}}
  const count=ROT[active.type].length;
  if(active.rot!==plan.rot){if(count>1&&rotateActive()){glowDirection('up');return;}}
  if(active.x!==plan.x){const sign=Math.sign(plan.x-active.x);if(move(sign,0)){glowDirection(sign<0?'left':'right');return;}}
  glowDirection('down');const cells=Math.min(7,1+Math.floor((level-1)/4));for(let n=0;n<cells;n++){if(!move(0,1)){lockPiece();break;}}
}
function tick(){if(!running||menuOpen||gameOver)return;tickCount++;if(clearFlash>0){clearFlash--;screen.classList.toggle('effect-tetris',clearText==='4 LINES!'&&clearFlash%2===0);screen.classList.toggle('effect-clear',clearText!=='4 LINES!'&&clearFlash%2===0);if(!clearFlash){screen.classList.remove('effect-clear','effect-tetris');clearText='';}}
  if(auto){if(tickCount%2===0)autoTick();}else manualTick();
  updateHud();render();
}
function updateHud(){$('screenLevel').textContent='LEVEL '+String(level).padStart(2,'0');$('screenPoints').textContent='POINTS '+String(score).padStart(6,'0');effect.textContent=clearFlash?clearText:(auto?'AUTO PLAY':'MANUAL')+'  |  LINES '+String(lines).padStart(2,'0');}
function drawBlock(x,y,size,ghost=false){if(ghost){ctx.fillStyle='rgba(36,53,31,.18)';ctx.fillRect(x+1,y+1,size-2,size-2);ctx.strokeStyle='rgba(36,53,31,.43)';ctx.strokeRect(x+1.5,y+1.5,size-3,size-3);return;}
  ctx.fillStyle=INK;ctx.fillRect(x,y,size-1,size-1);ctx.fillStyle=FADE;ctx.fillRect(x+2,y+2,size-5,size-5);ctx.fillStyle=INK;ctx.fillRect(x+3,y+3,size-7,size-7);ctx.fillStyle='#364d2d';ctx.fillRect(x+4,y+4,Math.max(2,size-10),Math.max(2,size-10));ctx.fillStyle='#778957';ctx.fillRect(x,y,size-2,1);}
function render(){ctx.fillStyle=LCD;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#526842';ctx.fillRect(BX-3,BY-3,C*S+6,R*S+6);
  ctx.fillStyle='#a8b97b';ctx.fillRect(BX,BY,C*S,R*S);
  ctx.fillStyle='rgba(36,53,31,.13)';for(let x=0;x<C;x++){for(let y=0;y<R;y++){ctx.fillRect(BX+x*S+S/2-1,BY+y*S+S/2-1,2,2);}}
  for(let y=0;y<R;y++){for(let x=0;x<C;x++){if(board[y][x])drawBlock(BX+x*S,BY+y*S,S);}}
  if(active){const s=shapeOf(active);let ghostY=active.y;while(!collides(board,s,active.x,ghostY+1))ghostY++;
    if(ghostY!==active.y)for(const [cx,cy] of s.cells){if(ghostY+cy>=0)drawBlock(BX+(active.x+cx)*S,BY+(ghostY+cy)*S,S,true);}
    for(const [cx,cy] of s.cells){if(active.y+cy>=0)drawBlock(BX+(active.x+cx)*S,BY+(active.y+cy)*S,S);}
  }
  ctx.fillStyle=INK;ctx.font='bold 15px monospace';ctx.textAlign='left';ctx.fillText('NEXT',176,22);
  for(let n=0;n<3;n++){const type=queue[n];if(!type)continue;const sh=ROT[type][0];const mini=12,shiftX=178+Math.round((88-sh.w*mini)/2),shiftY=33+n*58;for(const [cx,cy] of sh.cells)drawBlock(shiftX+cx*mini,shiftY+cy*mini,mini);if(n<2){ctx.globalAlpha=.22;ctx.fillRect(175,83+n*58,100,1);ctx.globalAlpha=1;}}
  ctx.fillStyle=INK;ctx.font='bold 13px monospace';ctx.fillText('LINES',176,216);ctx.font='bold 19px monospace';ctx.fillText(String(lines).padStart(3,'0'),176,236);
  ctx.font='bold 11px monospace';ctx.fillText(auto?'AI: ON':'AI: OFF',176,261);ctx.fillText('SPEED '+String(level).padStart(2,'0'),176,276);
}
function showOverlay(title,sub){overlay.innerHTML=`<div><div class="big">${title}</div><div class="small">${sub}</div></div>`;overlay.classList.remove('hidden');}
function beep(freq=440,duration=.08){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='square';osc.frequency.value=freq;gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration);}catch{}}
function hardDrop(){if(!active||!running||gameOver||menuOpen)return;let distance=0;while(move(0,1))distance++;score+=distance*2;glowDirection('down');lockPiece();updateHud();render();}
function manualAction(key){if(auto||menuOpen||!running||gameOver||!active)return;let changed=false;
  if(key==='up')changed=rotateActive();else if(key==='left')changed=move(-1,0);else if(key==='right')changed=move(1,0);else if(key==='down'){if(move(0,1)){score++;changed=true;}else{lockPiece();changed=true;}}
  if(changed){glowDirection(key);beep(380,.025);updateHud();render();}
}
const names=['PIXEL PETE','RETRO RAY','BITMASTER','GAME GIRL','DOT MATRIX','LEVEL LORD','8BIT ACE','OLD SCHOOL','GRID KING','NOKIA NED','BUTTON BAS','BLOCK BOSS','ARCADE AL','MRS PIXEL','BRICK FIX','LCD LEGEND','LINE CHASER','MONO MAN','SPEEDY K','TETRO TOM'];
const demo=names.map((name,i)=>({name,level:Math.max(1,24-i),score:Math.round((24200-i*1035+((i*17)%19)*43)/10)*10}));
function leaderboardRows(){const all=[...demo,{name:'YOU',level:best.level,score:best.score,you:true}].sort((a,b)=>b.level-a.level||b.score-a.score);return all.map((r,i)=>`<div class="leader-row ${r.you?'you':''}"><span>${String(i+1).padStart(2,'0')}.</span><span>${r.name}</span><span>L${String(r.level).padStart(2,'0')}</span><span>${String(r.score).padStart(6,'0')}</span></div>`).join('');}
function button(label,action,sub=''){return `<button type="button" class="menu-btn" data-action="${action}">${label}${sub?`<div class="menu-sub">${sub}</div>`:''}</button>`;}
function renderMenu(){menu.classList.remove('hidden');if(menuView==='leaderboard'){
    menu.innerHTML=`<div class="menu-title">LEADERBOARD</div><div class="leaderboard"><div class="leader-row head"><span>#</span><span>NAME</span><span>LVL</span><span>POINTS</span></div>${leaderboardRows()}</div>${button('◀ BACK','back')}`;return;}
  menu.innerHTML=`<div class="menu-title">BLOCKS MENU</div><div class="menu-actions">
    ${button(gameOver?'▶ NEW GAME':'▶ RESUME','resume')}
    ${button('★ LEADERBOARD','leaderboard')}
    ${button('↻ RESTART','restart')}
    ${button('◈ '+(auto?'AUTO PLAY: ON':'AUTO PLAY: OFF'),'mode')}
    ${button('♫ SOUND: '+(soundOn?'ON':'OFF'),'sound')}
    ${button('▣ SAVE PROGRESS','save')}
    ${button('▤ LOAD PROGRESS','load')}
  </div>`;
}
function openMenu(){if(menuOpen){closeMenu();return;}menuOpen=true;menuView='main';if(closingTimer){clearTimeout(closingTimer);closingTimer=null;}renderMenu();}
function closeMenu(){menuOpen=false;menu.classList.add('hidden');if(gameOver){newGame();return;}if(auto&&active&&!plan)plan=choosePlan();}
function flashMenu(message){const title=menu.querySelector('.menu-title');if(title)title.textContent=message;}
menu.addEventListener('click',e=>{const item=e.target.closest('[data-action]');if(!item)return;const action=item.dataset.action;beep(530,.06);
  if(action==='back'){menuView='main';renderMenu();return;}
  if(action==='leaderboard'){updateBest();menuView='leaderboard';renderMenu();return;}
  if(action==='resume'){closeMenu();return;}
  if(action==='restart'){newGame();return;}
  if(action==='sound'){soundOn=!soundOn;put(SOUND,soundOn);renderMenu();return;}
  if(action==='mode'){auto=!auto;plan=auto?choosePlan():null;saveProgress();renderMenu();return;}
  if(action==='save'){saveProgress();flashMenu('PROGRESS SAVED');return;}
  if(action==='load'){if(loadProgress(true)){renderMenu();flashMenu('PROGRESS LOADED');}else flashMenu('NO SAVE FOUND');return;}
});
function saveProgress(){if(!active||gameOver)return;put(SAVE,{v:1,board,bag,queue,active,level,score,lines,auto,soundOn,savedAt:Date.now()});}
function loadProgress(keepMenu=false){const s=safeRead(SAVE);if(!s||s.v!==1||!Array.isArray(s.board)||s.board.length!==R||s.board.some(row=>!Array.isArray(row)||row.length!==C)||!s.active||!ROT[s.active.type]||!Array.isArray(s.queue))return false;
  board=s.board.map(row=>row.map(v=>TYPES.includes(v)?v:null));bag=(s.bag||[]).filter(t=>TYPES.includes(t));queue=s.queue.filter(t=>TYPES.includes(t));active={type:s.active.type,rot:numeric(s.active.rot)%ROT[s.active.type].length,x:Number(s.active.x)||0,y:Number(s.active.y)||0};
  if(!Number.isInteger(active.x)||!Number.isInteger(active.y)||collides(board,shapeOf(active),active.x,active.y))return false;
  level=Math.max(1,Math.min(999,numeric(s.level)));score=numeric(s.score);lines=numeric(s.lines);auto=s.auto!==false;soundOn=!!s.soundOn;put(SOUND,soundOn);replenish();gameOver=false;running=true;clearFlash=0;overlay.classList.add('hidden');if(!keepMenu){menuOpen=false;menu.classList.add('hidden');}plan=auto?choosePlan():null;updateHud();render();return true;
}
$('menuBtn').addEventListener('click',openMenu);
for(const [key,btn] of Object.entries(buttons)){
  btn.addEventListener('pointerdown',e=>{e.preventDefault();if(auto||menuOpen)return;manualAction(key);if(key==='left'||key==='right'||key==='down'){clearInterval(repeatTimer);repeatTimer=setInterval(()=>manualAction(key),110);}try{btn.setPointerCapture(e.pointerId);}catch{}});
  const end=()=>{clearInterval(repeatTimer);repeatTimer=null;};btn.addEventListener('pointerup',end);btn.addEventListener('pointercancel',end);btn.addEventListener('lostpointercapture',end);
}
window.addEventListener('keydown',e=>{const map={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code))e.preventDefault();
  if(e.code==='Escape'||e.code==='Enter'){openMenu();return;}
  if((e.code==='Space'||e.code==='KeyX')&&!auto){hardDrop();return;}
  if(map[e.code]&&!auto)manualAction(map[e.code]);
});
let touchStart=null;const area=$('boardArea');area.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY};});area.addEventListener('pointerup',e=>{if(!touchStart||auto||menuOpen)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;if(Math.abs(dx)<18&&Math.abs(dy)<18){manualAction('up');return;}if(Math.abs(dx)>Math.abs(dy)){for(let n=0;n<Math.min(4,Math.round(Math.abs(dx)/35));n++)manualAction(dx>0?'right':'left');}else if(dy>35)hardDrop();else if(dy< -25)manualAction('up');});
function persistIfLive(){if(active&&!gameOver)saveProgress();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)persistIfLive();});window.addEventListener('pagehide',persistIfLive);
try{const b=safeRead(BEST);if(b&&typeof b.score==='number')best=b;const snd=safeRead(SOUND);if(typeof snd==='boolean')soundOn=snd;}catch{}
if(!loadProgress(false))newGame();updateHud();render();setInterval(tick,65);
window.retroBlocksTest={getState:()=>({board:board.map(r=>r.slice()),active:active&&{...active},plan,queue:[...queue],score,level,lines,auto,menuOpen,running,gameOver}),step:n=>{for(let i=0;i<(n||1);i++)tick();},newGame,setManual:()=>{auto=false;plan=null;},hardDrop,saveProgress,loadProgress};
})();
</script>
