<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#23453d" />
  <title>Snake 3310 Auto</title>
  <style>
    :root{
      --phone:#355d54;--phone-dark:#183b35;--phone-light:#6b8f86;
      --screen:#9cad6c;--pixel:#24351f;--screen-edge:#172d29;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#101615;font-family:Arial,Helvetica,sans-serif;color:white;overscroll-behavior:none}
    body{display:flex;justify-content:center;align-items:center;padding:18px}
    .wrap{width:min(94vw,430px)}
    .phone{position:relative;background:linear-gradient(145deg,var(--phone-light),var(--phone) 40%,var(--phone-dark));border-radius:42px 42px 58px 58px;padding:28px 25px 34px;box-shadow:0 20px 60px #0009,inset 0 0 0 3px #88a79f22,inset 0 -10px 22px #0003;border:2px solid #75958d66}
    .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px;color:#e8f0e8;font-weight:800;letter-spacing:.19em;font-size:13px;text-shadow:0 1px #000}
    .speaker{width:38px;height:5px;border-radius:999px;background:#122e29;box-shadow:inset 0 1px 1px #0008}
    .screen-shell{background:var(--screen-edge);padding:12px;border-radius:14px 14px 28px 28px;box-shadow:inset 0 0 12px #000b,0 2px 1px #9bb7af44}
    .screen{overflow:hidden;background:var(--screen);border:3px solid #566846;box-shadow:inset 0 0 22px #4f603c55;image-rendering:pixelated}
    .screen-hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px 6px;border-bottom:2px solid #566846;color:var(--pixel);font-family:monospace;font-weight:900;font-size:clamp(9px,2.6vw,11px);letter-spacing:.01em;pointer-events:none;text-shadow:0 1px #c7d29a66;white-space:nowrap}
    .screen-hud span{padding:1px 2px}
    .board-area{position:relative;aspect-ratio:1/1;overflow:hidden}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#9cad6cee;color:var(--pixel);font-family:monospace;font-weight:900;text-align:center;padding:20px;z-index:2}
    .overlay.hidden{display:none}
    .overlay .big{font-size:22px;letter-spacing:.05em;margin-bottom:8px}
    .overlay .small{font-size:12px;line-height:1.45}
    .status{text-align:center;min-height:18px;margin-top:7px;font-family:monospace;font-size:12px;color:#dce7dc;font-weight:800}
    .direction-wrap{display:flex;justify-content:center;padding-top:15px}
    .direction-pad{position:relative;width:164px;height:122px}
    .dir-key{position:absolute;border:1px solid #79968f66;background:linear-gradient(#52776e,#25443e);box-shadow:inset 0 2px 1px #fff2,0 4px 6px #0007;color:#eef5ef;font-size:21px;font-weight:900;transition:transform .045s ease,box-shadow .045s ease,filter .045s ease}
    .dir-key.up,.dir-key.down{left:55px;width:54px;height:42px}
    .dir-key.up{top:0;border-radius:28px 28px 10px 10px}
    .dir-key.down{bottom:0;border-radius:10px 10px 28px 28px}
    .dir-key.left,.dir-key.right{top:34px;width:58px;height:54px}
    .dir-key.left{left:0;border-radius:28px 10px 10px 28px}
    .dir-key.right{right:0;border-radius:10px 28px 28px 10px}
    .dir-key.center{left:55px;top:34px;width:54px;height:54px;border-radius:50%;font-size:10px;letter-spacing:.06em;background:linear-gradient(#78968f,#35564f)}
    .dir-key.pressed{transform:translateY(3px) scale(.97);box-shadow:inset 0 3px 6px #0009,0 1px 2px #0005;filter:brightness(.82)}
    .progress{height:6px;margin:7px 3px 0;border-radius:10px;background:#183b35;overflow:hidden;box-shadow:inset 0 1px 2px #0008}
    .progress>div{height:100%;width:0;background:#cbd8c9;transition:width .08s linear}
    .controls{padding-top:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    button,select{font:inherit;color:#eef5ef;user-select:none;touch-action:manipulation}
    select{appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center}
    select option{background:#2a4943;color:#eef5ef}
    .soft{height:44px;border-radius:18px 18px 28px 28px;border:1px solid #79968f66;background:linear-gradient(#52756d,#2a4943);box-shadow:inset 0 2px 2px #ffffff22,0 3px 4px #0007;font-weight:800;font-size:11px;letter-spacing:.04em}
    .soft:active{transform:translateY(2px);box-shadow:inset 0 2px 5px #0008}
    .tips{margin:14px 6px 0;text-align:center;color:#bac9c4;font-size:12px;line-height:1.45}
    @media (max-height:760px){body{align-items:flex-start}.phone{padding-top:18px;padding-bottom:22px}.controls{padding-top:13px}.tips{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="phone" aria-label="Nokia-style automatic Snake game">
      <div class="brand"><span class="speaker"></span><span>SNAKE AUTO 3310</span><span class="speaker"></span></div>
      <div class="screen-shell"><div class="screen">
        <div class="screen-hud" aria-label="Game score">
          <span id="screenLevel">LEVEL 01</span>
          <span id="screenPoints">POINTS 0</span>
        </div>
        <div class="board-area">
          <canvas id="game" width="240" height="240" aria-label="Automatic Snake game"></canvas>
          <div id="overlay" class="overlay hidden"><div><div class="big">LEVEL 1</div><div class="small">AUTO PLAY</div></div></div>
        </div>
      </div></div>

      <div id="status" class="status">AUTO HUNT</div>
      <div class="progress"><div id="progressBar"></div></div>

      <div class="direction-wrap" aria-label="Automatic direction indicator">
        <div class="direction-pad">
          <button class="dir-key up" id="dirUp" type="button" tabindex="-1" aria-label="Moving up">▲</button>
          <button class="dir-key left" id="dirLeft" type="button" tabindex="-1" aria-label="Moving left">◀</button>
          <button class="dir-key center" type="button" tabindex="-1" aria-hidden="true">AUTO</button>
          <button class="dir-key right" id="dirRight" type="button" tabindex="-1" aria-label="Moving right">▶</button>
          <button class="dir-key down" id="dirDown" type="button" tabindex="-1" aria-label="Moving down">▼</button>
        </div>
      </div>

      <div class="controls">
        <button id="pauseBtn" class="soft">PAUSE</button>
        <button id="testSpeedBtn" class="soft">TEST SPEED ×1</button>
        <select id="testLevelSelect" class="soft" aria-label="Select test level"></select>
        <button id="soundBtn" class="soft">SOUND OFF</button>
        <button id="restartBtn" class="soft">RESTART</button>
      </div>

      <div class="tips">Food first • clean row routing • random hazards • closing at 85%</div>
    </section>
  </main>

  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const overlay = document.getElementById('overlay');
    const screenLevel = document.getElementById('screenLevel');
    const screenPoints = document.getElementById('screenPoints');
    const statusEl = document.getElementById('status');
    const dirButtons = {
      up: document.getElementById('dirUp'),
      down: document.getElementById('dirDown'),
      left: document.getElementById('dirLeft'),
      right: document.getElementById('dirRight')
    };
    const progressBar = document.getElementById('progressBar');
    const pauseBtn = document.getElementById('pauseBtn');
    const testSpeedBtn = document.getElementById('testSpeedBtn');
    const testLevelSelect = document.getElementById('testLevelSelect');
    const soundBtn = document.getElementById('soundBtn');
    const restartBtn = document.getElementById('restartBtn');

    const COLS = 30;
    const ROWS = 30;
    const CELL = 8;
    const W = COLS * CELL;
    const H = ROWS * CELL;
    const MACRO_W = COLS / 2;
    const MACRO_H = ROWS / 2;

    const LCD = '#9cad6c';
    const PIXEL = '#24351f';
    const GRID = 'rgba(36,53,31,.055)';

    canvas.width = W;
    canvas.height = H;

    const OBSTACLE_GROUPS = [
      [[7,7]],
      [[3,4]],
      [[10,10],[11,10]],
      [[11,3],[11,4]],
      [[4,11],[5,11]],
      [[6,3],[7,3],[8,3]],
      [[2,8],[2,9]],
      [[9,12],[10,12]],
      [[12,6],[12,7],[12,8]],
      [[5,6],[5,7]],
      [[8,4],[9,4]],
      [[3,12],[4,12],[5,12]]
    ];

    let level = 1;
    let snake = [];
    let foods = [];
    let food = null;
    let bombs = [];
    let bonuses = [];
    let doublePointsSteps = 0;
    let doubleFoodSteps = 0;
    let bombSpawnCooldownSteps = 0;
    let bonusSpawnCooldownSteps = 0;
    let obstacles = new Set();
    let cycle = [];
    let cycleIndex = new Map();
    let running = true;
    let transitioning = false;
    let timer = null;
    let soundOn = false;
    let audioCtx = null;
    let foodCount = 0;
    let points = 0;
    let hazardMessage = '';
    let hazardMessageUntil = 0;
    let currentDirection = null;
    let closingMode = false;
    let closureSteps = 0;
    const TEST_SPEEDS = [1,2,4,8];
    const BOMB_LIFETIME_STEPS = 60;
    const BONUS_LIFETIME_STEPS = 110;
    const BONUS_EFFECT_STEPS = 140;
    const BONUS_MAX_CHASE_STEPS = 8;
    const BONUS_EXTRA_DETOUR_STEPS = 2;
    let testSpeedIndex = 0;

    function cellKey(x, y){ return x + ',' + y; }
    function pointKey(p){ return cellKey(p.x, p.y); }
    function macroKey(x, y){ return x + ':' + y; }

    function parseCellKey(k){
      const parts = k.split(',');
      return {x:Number(parts[0]), y:Number(parts[1])};
    }

    function levelDelay(){
      const normalDelay = Math.max(
        72,
        Math.round(180 - (level - 1) * 1.5)
      );

      return Math.max(
        10,
        Math.round(normalDelay / TEST_SPEEDS[testSpeedIndex])
      );
    }

    function obstacleMacrosForLevel(){
      const blocked = new Set();
      if(level < 6) return blocked;

      const stages = Math.min(OBSTACLE_GROUPS.length, level - 5);

      for(let i=0;i<stages;i++){
        for(const [x,y] of OBSTACLE_GROUPS[i]){
          blocked.add(macroKey(x,y));
        }
      }

      return blocked;
    }

    function addEdge(adj, a, b){
      const ak = pointKey(a);
      const bk = pointKey(b);
      if(!adj.has(ak)) adj.set(ak,new Set());
      if(!adj.has(bk)) adj.set(bk,new Set());
      adj.get(ak).add(bk);
      adj.get(bk).add(ak);
    }

    function removeEdge(adj, a, b){
      const ak = pointKey(a);
      const bk = pointKey(b);
      if(adj.has(ak)) adj.get(ak).delete(bk);
      if(adj.has(bk)) adj.get(bk).delete(ak);
    }

    function buildStripCycle(){
      const built = [];

      for(let y=0;y<ROWS;y++){
        built.push({x:0,y});
      }

      for(let x=1;x<COLS;x++){
        built.push({x,y:ROWS-1});
      }

      for(let y=ROWS-2;y>=0;y--){
        const rowOffset = (ROWS-1)-y;

        if(rowOffset % 2 === 1){
          for(let x=COLS-1;x>=1;x--){
            built.push({x,y});
          }
        }else{
          for(let x=1;x<COLS;x++){
            built.push({x,y});
          }
        }
      }

      if(built.length !== COLS*ROWS){
        throw new Error('Strip cycle length mismatch');
      }

      cycle = built;
      cycleIndex = new Map();
      cycle.forEach((p,i)=>cycleIndex.set(pointKey(p),i));
    }

    function buildLevelCycle(){
      const blockedMacros = obstacleMacrosForLevel();
      obstacles = new Set();

      for(const mk of blockedMacros){
        const [mx,my] = mk.split(':').map(Number);
        for(let oy=0;oy<2;oy++){
          for(let ox=0;ox<2;ox++){
            obstacles.add(cellKey(mx*2+ox,my*2+oy));
          }
        }
      }

      if(blockedMacros.size === 0){
        buildStripCycle();
        return;
      }

      const active = [];
      for(let my=0;my<MACRO_H;my++){
        for(let mx=0;mx<MACRO_W;mx++){
          if(!blockedMacros.has(macroKey(mx,my))) active.push({x:mx,y:my});
        }
      }

      const activeSet = new Set(active.map(m=>macroKey(m.x,m.y)));
      const start = active[0];
      const visited = new Set([macroKey(start.x,start.y)]);
      const stack = [start];
      const treeEdges = [];

      while(stack.length){
        const current = stack[stack.length-1];
        const preferred =
          current.y % 2 === 0
            ? [
                {x:current.x+1,y:current.y},
                {x:current.x,y:current.y+1},
                {x:current.x-1,y:current.y},
                {x:current.x,y:current.y-1}
              ]
            : [
                {x:current.x-1,y:current.y},
                {x:current.x,y:current.y+1},
                {x:current.x+1,y:current.y},
                {x:current.x,y:current.y-1}
              ];

        const options = preferred.filter(n =>
          n.x>=0 && n.x<MACRO_W &&
          n.y>=0 && n.y<MACRO_H &&
          activeSet.has(macroKey(n.x,n.y)) &&
          !visited.has(macroKey(n.x,n.y))
        );

        if(!options.length){
          stack.pop();
          continue;
        }

        const next = options[0];
        visited.add(macroKey(next.x,next.y));
        treeEdges.push([current,next]);
        stack.push(next);
      }

      if(visited.size !== active.length){
        throw new Error('Obstacle layout disconnected the board');
      }

      const adj = new Map();

      for(const m of active){
        const a={x:m.x*2,y:m.y*2};
        const b={x:m.x*2+1,y:m.y*2};
        const c={x:m.x*2+1,y:m.y*2+1};
        const d={x:m.x*2,y:m.y*2+1};
        addEdge(adj,a,b);
        addEdge(adj,b,c);
        addEdge(adj,c,d);
        addEdge(adj,d,a);
      }

      for(const [m1,m2] of treeEdges){
        if(m1.y === m2.y){
          const left = m1.x < m2.x ? m1 : m2;
          const right = m1.x < m2.x ? m2 : m1;
          const y = left.y * 2;

          const b={x:left.x*2+1,y:y};
          const c={x:left.x*2+1,y:y+1};
          const aR={x:right.x*2,y:y};
          const dR={x:right.x*2,y:y+1};

          removeEdge(adj,b,c);
          removeEdge(adj,aR,dR);
          addEdge(adj,b,aR);
          addEdge(adj,c,dR);
        }else{
          const top = m1.y < m2.y ? m1 : m2;
          const bottom = m1.y < m2.y ? m2 : m1;
          const x = top.x * 2;

          const d={x:x,y:top.y*2+1};
          const c={x:x+1,y:top.y*2+1};
          const aB={x:x,y:bottom.y*2};
          const bB={x:x+1,y:bottom.y*2};

          removeEdge(adj,c,d);
          removeEdge(adj,aB,bB);
          addEdge(adj,d,aB);
          addEdge(adj,c,bB);
        }
      }

      const expected = active.length * 4;
      const startKey = adj.keys().next().value;
      const built = [];
      let previous = null;
      let current = startKey;

      do{
        built.push(parseCellKey(current));
        const ns = [...adj.get(current)];
        if(ns.length !== 2) throw new Error('Invalid cycle degree');
        const next = ns[0] !== previous ? ns[0] : ns[1];
        previous = current;
        current = next;

        if(built.length > expected + 1) throw new Error('Cycle overflow');
      }while(current !== startKey);

      if(built.length !== expected){
        throw new Error('Cycle length mismatch');
      }

      cycle = built;
      cycleIndex = new Map();
      cycle.forEach((p,i)=>cycleIndex.set(pointKey(p),i));
    }

    function forwardDistance(a,b){
      return (b - a + cycle.length) % cycle.length;
    }

    function gridNeighbors(p){
      const out = [];
      if(p.x>0) out.push({x:p.x-1,y:p.y});
      if(p.x<COLS-1) out.push({x:p.x+1,y:p.y});
      if(p.y>0) out.push({x:p.x,y:p.y-1});
      if(p.y<ROWS-1) out.push({x:p.x,y:p.y+1});
      return out;
    }

    function closureWindowSize(fillRatio){
      if(fillRatio >= 0.97) return 10;
      if(fillRatio >= 0.93) return 20;
      if(fillRatio >= 0.89) return 34;
      if(fillRatio >= 0.85) return 56;
      return Infinity;
    }

    function baseFoodTargetCount(){
      return Math.min(
        10,
        1 + Math.floor((Math.max(1,level) - 1) / 2)
      );
    }

    function foodTargetCount(){
      const multiplier = doubleFoodSteps > 0 ? 2 : 1;
      return Math.min(20,baseFoodTargetCount()*multiplier);
    }

    function bombMaxCount(){
      if(level < 8) return 0;
      return Math.min(4, 1 + Math.floor((level - 8) / 3));
    }

    function bonusMaxCount(){
      if(level < 10) return 0;
      if(level < 16) return 1;
      return 2;
    }

    function randomSteps(min,max){
      return Math.floor(
        min + Math.random() * (max-min+1)
      );
    }

    function scheduleNextBomb(){
      if(level < 8){
        bombSpawnCooldownSteps = Infinity;
        return;
      }

      const levelHelp = Math.min(22,Math.max(0,level-8)*2);
      bombSpawnCooldownSteps = randomSteps(
        Math.max(18,46-levelHelp),
        Math.max(50,105-levelHelp)
      );
    }

    function scheduleNextBonus(){
      if(level < 10){
        bonusSpawnCooldownSteps = Infinity;
        return;
      }

      const levelHelp = Math.min(26,Math.max(0,level-10)*2);
      bonusSpawnCooldownSteps = randomSteps(
        Math.max(28,72-levelHelp),
        Math.max(70,155-levelHelp)
      );
    }

    function bombCells(bomb){
      return [
        {x:bomb.x,y:bomb.y},
        {x:bomb.x+1,y:bomb.y},
        {x:bomb.x,y:bomb.y+1},
        {x:bomb.x+1,y:bomb.y+1}
      ];
    }

    function bombContains(bomb,p){
      return (
        p.x >= bomb.x &&
        p.x <= bomb.x+1 &&
        p.y >= bomb.y &&
        p.y <= bomb.y+1
      );
    }

    function isBombCell(p){
      return bombs.some(bomb=>bombContains(bomb,p));
    }

    function bombShrinkAmount(){
      return Math.min(
        20,
        8 + Math.floor(Math.max(0, level - 8) / 2) * 2
      );
    }

    function bombPointPenalty(){
      return level * 10;
    }

    function activateClosingMode(){
      if(closingMode) return;
      closingMode = true;
      closureSteps = 0;

      chooseFoodTarget();
      ensureFoodCount();
    }

    function buildFoodCandidates(){
      const occupied = new Set([
        ...snake.map(pointKey),
        ...foods.map(pointKey),
        ...bombs.flatMap(bombCells).map(pointKey),
        ...bonuses.map(b=>pointKey(b))
      ]);
      const head = snake[0];
      const tail = snake[snake.length-1];
      const headIndex = cycleIndex.get(pointKey(head));
      const tailIndex = cycleIndex.get(pointKey(tail));
      const tailGap = forwardDistance(headIndex, tailIndex);
      const fillRatio = snake.length / cycle.length;
      const safetyMargin = Math.min(
        8,
        Math.max(1, Math.floor(snake.length * 0.01))
      );

      let safeFree = cycle
        .filter(p=>{
          const pk = pointKey(p);
          if(occupied.has(pk)) return false;

          const idx = cycleIndex.get(pk);
          const advance = forwardDistance(headIndex, idx);

          return (
            advance > 0 &&
            advance < Math.max(1, tailGap - safetyMargin)
          );
        })
        .map(p=>({
          p,
          advance:forwardDistance(
            headIndex,
            cycleIndex.get(pointKey(p))
          )
        }))
        .sort((a,b)=>a.advance-b.advance);

      const windowSize = closureWindowSize(fillRatio);

      if(Number.isFinite(windowSize)){
        safeFree = safeFree.slice(
          0,
          Math.min(windowSize,safeFree.length)
        );
      }

      return safeFree;
    }

    function addOneFood(){
      const candidates = buildFoodCandidates();

      if(!candidates.length){
        const occupied = new Set([
          ...snake.map(pointKey),
          ...foods.map(pointKey),
          ...bombs.flatMap(bombCells).map(pointKey),
          ...bonuses.map(b=>pointKey(b))
        ]);

        const anyFree = cycle.filter(
          p=>!occupied.has(pointKey(p))
        );

        if(!anyFree.length){
          return false;
        }

        foods.push({
          ...anyFree[Math.floor(Math.random()*anyFree.length)]
        });
        return true;
      }

      let pool = candidates;

      if(pool.length > 8){
        const notImmediate = pool.filter(item=>item.advance >= 3);

        if(notImmediate.length >= 3){
          pool = notImmediate;
        }
      }

      const pick = pool[Math.floor(Math.random()*pool.length)];
      foods.push({...pick.p});
      return true;
    }

    function ensureFoodCount(){
      const target = foodTargetCount();

      while(foods.length < target){
        if(!addOneFood()) break;
      }

      if(!foods.length){
        food = null;
        completeLevel();
        return;
      }

      chooseFoodTarget();
    }

    function chooseFoodTarget(){
      if(!foods.length){
        food = null;
        return;
      }

      if(closingMode){
        const headIndex =
          cycleIndex.get(pointKey(snake[0]));

        const ordered = foods
          .slice()
          .sort((a,b)=>{
            const ai = cycleIndex.get(pointKey(a));
            const bi = cycleIndex.get(pointKey(b));

            return (
              forwardDistance(headIndex,ai) -
              forwardDistance(headIndex,bi)
            );
          });

        food = ordered[0];
        return;
      }

      const currentStillExists =
        food && foods.some(candidate=>same(candidate,food));

      if(currentStillExists){
        return;
      }

      let best = null;

      for(const candidate of foods){
        const path = orderedPathTo(candidate);

        if(!path.length) continue;

        if(!best || path.length < best.distance){
          best = {
            candidate,
            distance:path.length
          };
        }
      }

      food = best
        ? best.candidate
        : foods[0];
    }

    function occupiedHazardCells(){
      return new Set([
        ...snake.map(pointKey),
        ...foods.map(pointKey),
        ...bombs.flatMap(bombCells).map(pointKey),
        ...bonuses.map(b=>pointKey(b))
      ]);
    }

    function addOneBomb(){
      const occupied = occupiedHazardCells();
      const head = snake[0];
      const candidates = [];

      for(let y=0;y<ROWS-1;y++){
        for(let x=0;x<COLS-1;x++){
          const cells = [
            {x,y},
            {x:x+1,y},
            {x,y:y+1},
            {x:x+1,y:y+1}
          ];

          const valid = cells.every(cell=>{
            const key = pointKey(cell);
            return (
              cycleIndex.has(key) &&
              !obstacles.has(key) &&
              !occupied.has(key)
            );
          });

          if(!valid) continue;

          const distance =
            Math.abs(x-head.x) +
            Math.abs(y-head.y);

          if(distance >= 7){
            candidates.push({x,y});
          }
        }
      }

      if(!candidates.length) return false;

      const pick =
        candidates[Math.floor(Math.random()*candidates.length)];

      bombs.push({
        ...pick,
        ttl:BOMB_LIFETIME_STEPS
      });

      return true;
    }

    function maybeSpawnBomb(){
      const maxBombs = bombMaxCount();

      if(maxBombs <= 0) return;
      if(bombs.length >= maxBombs) return;
      if(bombSpawnCooldownSteps > 0) return;

      const spawnChance =
        Math.min(0.16,0.07 + Math.max(0,level-8)*0.008);

      if(Math.random() < spawnChance){
        addOneBomb();
        scheduleNextBomb();
      }
    }

    function addOneBonus(){
      const occupied = occupiedHazardCells();
      const head = snake[0];

      const candidates = cycle.filter(p=>{
        const key = pointKey(p);
        if(occupied.has(key)) return false;
        if(obstacles.has(key)) return false;

        const distance =
          Math.abs(p.x-head.x) +
          Math.abs(p.y-head.y);

        return distance >= 5;
      });

      if(!candidates.length) return false;

      const pick =
        candidates[Math.floor(Math.random()*candidates.length)];

      const type =
        Math.random() < 0.5
          ? 'double-points'
          : 'double-food';

      bonuses.push({
        ...pick,
        type,
        ttl:BONUS_LIFETIME_STEPS
      });

      return true;
    }

    function maybeSpawnBonus(){
      const maxBonuses = bonusMaxCount();

      if(maxBonuses <= 0) return;
      if(bonuses.length >= maxBonuses) return;
      if(bonusSpawnCooldownSteps > 0) return;

      const spawnChance =
        Math.min(0.10,0.045 + Math.max(0,level-10)*0.004);

      if(Math.random() < spawnChance){
        addOneBonus();
        scheduleNextBonus();
      }
    }

    function tickTimedItems(){
      const bombsBefore = bombs.length;
      const bonusesBefore = bonuses.length;

      for(const bomb of bombs){
        bomb.ttl--;
      }

      bombs = bombs.filter(bomb=>bomb.ttl>0);

      for(const bonus of bonuses){
        bonus.ttl--;
      }

      bonuses = bonuses.filter(bonus=>bonus.ttl>0);

      if(
        bombs.length < bombsBefore &&
        bombSpawnCooldownSteps <= 0
      ){
        scheduleNextBomb();
      }

      if(
        bonuses.length < bonusesBefore &&
        bonusSpawnCooldownSteps <= 0
      ){
        scheduleNextBonus();
      }

      if(doublePointsSteps > 0) doublePointsSteps--;
      if(doubleFoodSteps > 0) doubleFoodSteps--;

      if(
        Number.isFinite(bombSpawnCooldownSteps) &&
        bombSpawnCooldownSteps > 0
      ){
        bombSpawnCooldownSteps--;
      }

      if(
        Number.isFinite(bonusSpawnCooldownSteps) &&
        bonusSpawnCooldownSteps > 0
      ){
        bonusSpawnCooldownSteps--;
      }

      maybeSpawnBomb();
      maybeSpawnBonus();

      if(doubleFoodSteps > 0){
        ensureFoodCount();
      }
    }

    function activateBonus(bonus){
      if(bonus.type === 'double-points'){
        doublePointsSteps = BONUS_EFFECT_STEPS;
        hazardMessage = 'BONUS! ×2 POINTS';
      }else{
        doubleFoodSteps = BONUS_EFFECT_STEPS;
        hazardMessage = 'BONUS! DOUBLE FOOD';
        ensureFoodCount();
      }

      scheduleNextBonus();
      hazardMessageUntil = Date.now() + 1200;
      beep(980,0.06);
      setTimeout(()=>beep(1220,0.08),70);
    }

    function nearestBonusPath(){
      if(!bonuses.length) return null;

      let best = null;

      for(const bonus of bonuses){
        if(
          bonus.type === 'double-points' &&
          doublePointsSteps > 40
        ){
          continue;
        }

        if(
          bonus.type === 'double-food' &&
          doubleFoodSteps > 40
        ){
          continue;
        }

        const path = orderedPathTo(bonus);
        if(!path.length) continue;

        if(!best || path.length < best.path.length){
          best = {bonus,path};
        }
      }

      return best;
    }

    function spawnFood(){
      ensureFoodCount();
    }

    function orderedPathTo(target){
      if(!target || !snake.length) return [];

      const head = snake[0];
      const tail = snake[snake.length-1];
      const headIndex = cycleIndex.get(pointKey(head));
      const tailIndex = cycleIndex.get(pointKey(tail));
      const targetIndex = cycleIndex.get(pointKey(target));

      if(
        headIndex === undefined ||
        tailIndex === undefined ||
        targetIndex === undefined
      ){
        return [];
      }

      const tailGap = forwardDistance(headIndex, tailIndex);
      const targetAdvance = forwardDistance(headIndex, targetIndex);

      if(targetAdvance <= 0 || targetAdvance >= tailGap){
        return [];
      }

      const startKey = pointKey(head);
      const targetKey = pointKey(target);
      const queue = [head];
      const previous = new Map([[startKey, null]]);
      let index = 0;

      while(index < queue.length){
        const current = queue[index++];
        const currentKey = pointKey(current);

        if(currentKey === targetKey){
          const path = [];
          let cursorKey = targetKey;

          while(cursorKey !== startKey){
            const p = parseCellKey(cursorKey);
            path.push(p);
            cursorKey = previous.get(cursorKey);
          }

          path.reverse();
          return path;
        }

        const currentCycleIndex = cycleIndex.get(currentKey);
        const currentAdvance =
          forwardDistance(headIndex, currentCycleIndex);

        const neighbors = gridNeighbors(current)
          .filter(next=>{
            const nk = pointKey(next);
            const ni = cycleIndex.get(nk);

            if(ni === undefined) return false;
            if(previous.has(nk)) return false;
            if(isBombCell(next)) return false;

            const advance = forwardDistance(headIndex, ni);

            return (
              advance > currentAdvance &&
              advance <= targetAdvance &&
              advance < tailGap
            );
          })
          .sort((a,b)=>{
            const da =
              Math.abs(a.x-target.x) +
              Math.abs(a.y-target.y);

            const db =
              Math.abs(b.x-target.x) +
              Math.abs(b.y-target.y);

            return da-db;
          });

        for(const next of neighbors){
          const nk = pointKey(next);
          previous.set(nk,currentKey);
          queue.push(next);
        }
      }

      return [];
    }

    function safeClosingMove(){
      const head = snake[0];
      const headIndex = cycleIndex.get(pointKey(head));
      const immediate =
        cycle[(headIndex+1)%cycle.length];

      if(!isBombCell(immediate)){
        return {...immediate};
      }

      const tail = snake[snake.length-1];
      const tailIndex = cycleIndex.get(pointKey(tail));
      const tailGap = forwardDistance(headIndex,tailIndex);
      const bodyBlocked = new Set(
        snake.slice(0,-1).map(pointKey)
      );

      const alternatives = gridNeighbors(head)
        .filter(next=>{
          const key = pointKey(next);
          const idx = cycleIndex.get(key);

          if(idx === undefined) return false;
          if(obstacles.has(key)) return false;
          if(isBombCell(next)) return false;
          if(bodyBlocked.has(key)) return false;

          const advance =
            forwardDistance(headIndex,idx);

          return (
            advance > 0 &&
            advance < tailGap
          );
        })
        .sort((a,b)=>{
          const ai = cycleIndex.get(pointKey(a));
          const bi = cycleIndex.get(pointKey(b));

          return (
            forwardDistance(headIndex,ai) -
            forwardDistance(headIndex,bi)
          );
        });

      if(alternatives.length){
        return alternatives[0];
      }

      for(let advance=2;advance<=48;advance++){
        const target =
          cycle[(headIndex+advance)%cycle.length];

        if(isBombCell(target)) continue;

        const path = orderedPathTo(target);

        if(path.length){
          return path[0];
        }
      }

      const emergency = gridNeighbors(head)
        .filter(next=>{
          const key = pointKey(next);

          return (
            cycleIndex.has(key) &&
            !obstacles.has(key) &&
            !isBombCell(next) &&
            !bodyBlocked.has(key)
          );
        });

      if(emergency.length){
        return emergency[0];
      }

      return {...immediate};
    }

    function chooseMove(){
      const fillRatio = snake.length / cycle.length;

      if(!closingMode && fillRatio >= 0.85){
        activateClosingMode();
      }

      chooseFoodTarget();

      const foodPath = food
        ? orderedPathTo(food)
        : [];

      const bonusChoice = nearestBonusPath();
      const bonusLimit =
        closingMode ? 4 : BONUS_MAX_CHASE_STEPS;

      const bonusIsWorthDetour =
        bonusChoice &&
        bonusChoice.path.length > 0 &&
        bonusChoice.path.length <= bonusLimit &&
        (
          !foodPath.length ||
          bonusChoice.path.length <=
            foodPath.length + BONUS_EXTRA_DETOUR_STEPS
        );

      if(bonusIsWorthDetour){
        return bonusChoice.path[0];
      }

      if(closingMode){
        return safeClosingMove();
      }

      if(foodPath.length){
        return foodPath[0];
      }

      const head = snake[0];
      const hi = cycleIndex.get(pointKey(head));
      const next = cycle[(hi+1)%cycle.length];

      if(isBombCell(next)){
        return safeClosingMove();
      }

      return {...next};
    }

    function directionName(from,to){
      const dx = to.x-from.x;
      const dy = to.y-from.y;

      if(dx === 1) return 'right';
      if(dx === -1) return 'left';
      if(dy === 1) return 'down';
      if(dy === -1) return 'up';

      return null;
    }

    function showDirection(direction){
      currentDirection = direction;

      for(const [name,button] of Object.entries(dirButtons)){
        button.classList.toggle(
          'pressed',
          name === direction
        );
      }
    }

    function same(a,b){
      return !!a && !!b && a.x===b.x && a.y===b.y;
    }

    function step(){
      clearTimeout(timer);

      if(!running || transitioning) return;

      const next = chooseMove();
      showDirection(
        directionName(snake[0],next)
      );
      const eatenIndex = foods.findIndex(f=>same(next,f));
      const bombIndex = bombs.findIndex(b=>bombContains(b,next));
      const bonusIndex = bonuses.findIndex(b=>same(next,b));
      const willEat = eatenIndex >= 0;
      const hitBomb = bombIndex >= 0;
      const hitBonus = bonusIndex >= 0;
      const oldLength = snake.length;
      const blockedBody = new Set((willEat ? snake : snake.slice(0,-1)).map(pointKey));

      if(blockedBody.has(pointKey(next)) || obstacles.has(pointKey(next))){
        recoverLevel();
        return;
      }

      snake.unshift(next);

      if(closingMode){
        closureSteps++;
      }

      if(hitBomb){
        bombs.splice(bombIndex,1);

        const shrinkBy = Math.min(
          bombShrinkAmount(),
          Math.max(0, oldLength - 5)
        );
        const penalty = Math.min(points,bombPointPenalty());
        const targetLength = Math.max(5, oldLength - shrinkBy);

        snake.length = Math.min(snake.length,targetLength);
        points = Math.max(0,points - penalty);
  
        hazardMessage =
          'BOMB! -' + penalty + ' PTS • -' + shrinkBy + ' LENGTH';
        hazardMessageUntil = Date.now() + 1100;

        beep(180,0.12);
        setTimeout(()=>beep(130,0.12),90);

        scheduleNextBomb();
        chooseFoodTarget();
      }else if(hitBonus){
        const bonus = bonuses[bonusIndex];
        bonuses.splice(bonusIndex,1);
        activateBonus(bonus);
        snake.pop();
      }else if(willEat){
        const ateActiveTarget =
          food && same(foods[eatenIndex],food);

        foods.splice(eatenIndex,1);

        if(ateActiveTarget){
          food = null;
            }

        foodCount++;
        points += level * (doublePointsSteps > 0 ? 2 : 1);
        beep(720,0.03);

        if(snake.length >= cycle.length){
          updateHud();
          draw();
          completeLevel();
          return;
        }

        ensureFoodCount();
      }else{
        snake.pop();
      }

      tickTimedItems();
      updateHud();
      draw();
      timer = setTimeout(step,levelDelay());
    }

    function beep(freq,duration){
      if(!soundOn) return;

      try{
        audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type='square';
        o.frequency.value=freq;
        g.gain.value=.035;
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
        o.stop(audioCtx.currentTime+duration);
      }catch(e){}
    }

    function startLevel(){
      clearTimeout(timer);
      transitioning = false;
      running = true;
      foodCount = 0;
      foods = [];
      food = null;
      bombs = [];
      bonuses = [];
      doublePointsSteps = 0;
      doubleFoodSteps = 0;
      bombSpawnCooldownSteps = 0;
      bonusSpawnCooldownSteps = 0;
      scheduleNextBomb();
      scheduleNextBonus();
      hazardMessage = '';
      hazardMessageUntil = 0;
      currentDirection = null;
      showDirection(null);
      closingMode = false;
      closureSteps = 0;

      buildLevelCycle();

      snake = [
        {...cycle[4]},
        {...cycle[3]},
        {...cycle[2]},
        {...cycle[1]},
        {...cycle[0]}
      ];

      spawnFood();
      overlay.classList.add('hidden');
      pauseBtn.textContent='PAUSE';

      updateHud();
      draw();

      timer=setTimeout(step,350);
    }

    function completeLevel(){
      if(transitioning) return;

      transitioning = true;
      running = false;
      clearTimeout(timer);
      foods = [];
      food = null;
      bombs = [];
      bonuses = [];

      beep(900,.08);
      setTimeout(()=>beep(1080,.1),100);

      overlay.innerHTML =
        '<div><div class="big">LEVEL ' + level + ' COMPLETE</div>' +
        '<div class="small">AREA FILLED 100%<br>NEXT LEVEL...</div></div>';

      overlay.classList.remove('hidden');
      statusEl.textContent='LEVEL COMPLETE';

      setTimeout(()=>{
        level++;
        startLevel();
      },1200);
    }

    function recoverLevel(){
      transitioning = true;
      running = false;
      clearTimeout(timer);

      overlay.innerHTML =
        '<div><div class="big">RECOVERING</div>' +
        '<div class="small">REBUILDING SAFE ROUTE</div></div>';

      overlay.classList.remove('hidden');
      statusEl.textContent='RECOVERING';

      setTimeout(()=>startLevel(),650);
    }

    function updateHud(){
      const obstacleCells = obstacles.size;
      const total = cycle.length;

      screenLevel.textContent =
        'LEVEL ' + String(level).padStart(2,'0');

      if(level <= 30){
        testLevelSelect.value = String(level);
      }

      screenPoints.textContent =
        'POINTS ' + String(points);

      progressBar.style.width =
        ((snake.length/total)*100).toFixed(1)+'%';

      const fillRatio = snake.length / total;

      if(Date.now() < hazardMessageUntil){
        statusEl.textContent = hazardMessage;
        return;
      }

      if(closingMode){
        const straightened = closureSteps >= snake.length;
        const effectLabel =
          (doublePointsSteps > 0 ? ' • ×2 PTS' : '') +
          (doubleFoodSteps > 0 ? ' • DOUBLE FOOD' : '');

        statusEl.textContent =
          straightened
            ? (obstacleCells
                ? 'CLOSING LINES' + effectLabel + ' • OBSTACLES'
                : 'CLOSING LINES' + effectLabel)
            : (obstacleCells
                ? 'STRAIGHTENING' + effectLabel + ' • OBSTACLES'
                : 'STRAIGHTENING LINES' + effectLabel);
      }else{
        const foodLabel = foods.length + ' FOOD';
        const bombLabel = bombs.length
          ? ' • ' + bombs.length + ' BOMB' + (bombs.length === 1 ? '' : 'S')
          : '';
        const effectLabel =
          (doublePointsSteps > 0 ? ' • ×2 PTS' : '') +
          (doubleFoodSteps > 0 ? ' • DOUBLE FOOD' : '');

        statusEl.textContent =
          obstacleCells
            ? 'AUTO HUNT • ' + foodLabel + bombLabel + effectLabel + ' • OBSTACLES'
            : 'AUTO HUNT • ' + foodLabel + bombLabel + effectLabel;
      }
    }

    function drawGrid(){
      ctx.strokeStyle=GRID;
      ctx.lineWidth=1;

      for(let x=0;x<=W;x+=CELL){
        ctx.beginPath();
        ctx.moveTo(x+.5,0);
        ctx.lineTo(x+.5,H);
        ctx.stroke();
      }

      for(let y=0;y<=H;y+=CELL){
        ctx.beginPath();
        ctx.moveTo(0,y+.5);
        ctx.lineTo(W,y+.5);
        ctx.stroke();
      }
    }

    function drawObstacleCell(x,y){
      const px=x*CELL;
      const py=y*CELL;

      ctx.fillStyle=PIXEL;
      ctx.fillRect(px+1,py+1,CELL-2,CELL-2);

      ctx.fillStyle=LCD;
      ctx.fillRect(px+3,py+3,2,2);
    }

    function drawSnakePixel(p,head){
      const px=p.x*CELL;
      const py=p.y*CELL;

      ctx.fillStyle=PIXEL;
      ctx.fillRect(px+1,py+1,CELL-2,CELL-2);

      if(head){
        ctx.fillStyle=LCD;
        ctx.fillRect(px+2,py+2,1,1);
        ctx.fillRect(px+5,py+2,1,1);
      }
    }

    function drawFood(){
      for(const item of foods){
        const px=item.x*CELL;
        const py=item.y*CELL;

        ctx.fillStyle=PIXEL;
        ctx.fillRect(px+2,py+1,4,6);
        ctx.fillRect(px+1,py+2,6,4);

        ctx.fillStyle=LCD;
        ctx.fillRect(px+3,py+3,2,2);
      }
    }

    function drawBombs(){
      for(const bomb of bombs){
        const px=bomb.x*CELL;
        const py=bomb.y*CELL;
        const size=CELL*2;
        const countdown=Math.max(
          1,
          Math.ceil(bomb.ttl/(BOMB_LIFETIME_STEPS/5))
        );

        ctx.fillStyle=PIXEL;
        ctx.fillRect(px+1,py+1,size-2,size-2);

        ctx.fillStyle=LCD;
        ctx.fillRect(px+3,py+3,size-6,size-6);

        ctx.fillStyle=PIXEL;
        ctx.font='bold 9px monospace';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(
          String(countdown),
          px+size/2,
          py+size/2+0.5
        );
      }
    }

    function drawBonuses(){
      for(const bonus of bonuses){
        const px=bonus.x*CELL;
        const py=bonus.y*CELL;

        ctx.fillStyle=PIXEL;
        ctx.fillRect(px+1,py+1,CELL-2,CELL-2);

        ctx.fillStyle=LCD;
        ctx.font='bold 5px monospace';
        ctx.textAlign='center';
        ctx.textBaseline='middle';
        ctx.fillText(
          bonus.type === 'double-points' ? '2X' : 'F+',
          px+CELL/2,
          py+CELL/2+0.5
        );
      }
    }

    function draw(){
      ctx.fillStyle=LCD;
      ctx.fillRect(0,0,W,H);

      drawGrid();

      for(const k of obstacles){
        const p=parseCellKey(k);
        drawObstacleCell(p.x,p.y);
      }

      drawFood();
      drawBonuses();
      drawBombs();

      for(let i=snake.length-1;i>=0;i--){
        drawSnakePixel(snake[i],i===0);
      }

      ctx.strokeStyle=PIXEL;
      ctx.lineWidth=2;
      ctx.strokeRect(1,1,W-2,H-2);
    }

    for(let testLevel=1;testLevel<=30;testLevel++){
      const option = document.createElement('option');
      option.value = String(testLevel);
      option.textContent = 'TEST LEVEL ' + testLevel;
      testLevelSelect.appendChild(option);
    }

    pauseBtn.addEventListener('click',()=>{
      if(transitioning) return;

      running=!running;
      pauseBtn.textContent=running?'PAUSE':'RESUME';

      if(running){
        overlay.classList.add('hidden');
        timer=setTimeout(step,levelDelay());
      }else{
        clearTimeout(timer);
        overlay.innerHTML=
          '<div><div class="big">PAUSED</div><div class="small">PRESS RESUME</div></div>';
        overlay.classList.remove('hidden');
      }
    });

    testSpeedBtn.addEventListener('click',()=>{
      testSpeedIndex =
        (testSpeedIndex + 1) % TEST_SPEEDS.length;

      testSpeedBtn.textContent =
        'TEST SPEED ×' + TEST_SPEEDS[testSpeedIndex];

      if(running && !transitioning){
        clearTimeout(timer);
        timer=setTimeout(step,levelDelay());
      }
    });

    testLevelSelect.addEventListener('change',()=>{
      const selected = Number(testLevelSelect.value);

      if(!Number.isFinite(selected) || selected < 1) return;

      level = selected;
      points = 0;
      startLevel();
    });

    soundBtn.addEventListener('click',()=>{
      soundOn=!soundOn;
      soundBtn.textContent=soundOn?'SOUND ON':'SOUND OFF';
      if(soundOn) beep(650,.04);
    });

    restartBtn.addEventListener('click',()=>{
      level = 1;
      points = 0;
      startLevel();
    });

    document.addEventListener('visibilitychange',()=>{
      if(document.hidden && running && !transitioning){
        running=false;
        clearTimeout(timer);
        pauseBtn.textContent='RESUME';
        overlay.innerHTML=
          '<div><div class="big">PAUSED</div><div class="small">PRESS RESUME</div></div>';
        overlay.classList.remove('hidden');
      }
    });

    startLevel();
  })();
  </script>
