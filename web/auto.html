<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#23453d" />
  <title>Snake 3310 Auto</title>
  <style>
    :root{
      --phone:#355d54;--phone-dark:#183b35;--phone-light:#6b8f86;--screen:#9cad6c;--pixel:#24351f;--screen-edge:#172d29;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#101615;font-family:Arial,Helvetica,sans-serif;color:white;overscroll-behavior:none}
    body{display:flex;justify-content:center;align-items:center;padding:18px}
    .wrap{width:min(94vw,430px)}
    .phone{position:relative;background:linear-gradient(145deg,var(--phone-light),var(--phone) 40%,var(--phone-dark));border-radius:42px 42px 58px 58px;padding:28px 25px 34px;box-shadow:0 20px 60px #0009,inset 0 0 0 3px #88a79f22,inset 0 -10px 22px #0003;border:2px solid #75958d66}
    .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px;color:#e8f0e8;font-weight:800;letter-spacing:.19em;font-size:13px;text-shadow:0 1px #000}
    .speaker{width:38px;height:5px;border-radius:999px;background:#122e29;box-shadow:inset 0 1px 1px #0008}
    .screen-shell{background:var(--screen-edge);padding:12px;border-radius:14px 14px 28px 28px;box-shadow:inset 0 0 12px #000b,0 2px 1px #9bb7af44}
    .screen{position:relative;aspect-ratio:1/1.03;overflow:hidden;background:var(--screen);border:3px solid #566846;box-shadow:inset 0 0 22px #4f603c55;image-rendering:pixelated}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#9cad6cee;color:var(--pixel);font-family:monospace;font-weight:900;text-align:center;padding:20px;z-index:2}
    .overlay.hidden{display:none}
    .overlay .big{font-size:22px;letter-spacing:.05em;margin-bottom:8px}
    .overlay .small{font-size:12px;line-height:1.45}
    .hud{display:flex;justify-content:space-between;margin:8px 2px 0;font-family:monospace;font-weight:900;color:#dce7dc;font-size:12px;text-shadow:0 1px #000}
    .status{text-align:center;min-height:18px;margin-top:5px;font-family:monospace;font-size:12px;color:#dce7dc;font-weight:800}
    .progress{height:6px;margin:7px 3px 0;border-radius:10px;background:#183b35;overflow:hidden;box-shadow:inset 0 1px 2px #0008}
    .progress > div{height:100%;width:0;background:#cbd8c9;transition:width .08s linear}
    .controls{padding-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:center}
    button{font:inherit;color:#eef5ef;user-select:none;touch-action:manipulation}
    .soft{height:44px;border-radius:18px 18px 28px 28px;border:1px solid #79968f66;background:linear-gradient(#52756d,#2a4943);box-shadow:inset 0 2px 2px #ffffff22,0 3px 4px #0007;font-weight:800;font-size:11px;letter-spacing:.04em}
    .soft:active{transform:translateY(2px);box-shadow:inset 0 2px 5px #0008}
    .auto-key{grid-column:1/4;justify-self:center;width:116px;height:56px;border-radius:50%;border:1px solid #79968f66;background:linear-gradient(#78968f,#35564f);box-shadow:inset 0 2px 2px #fff2,0 4px 6px #0007;font-size:12px;font-weight:900}
    .tips{margin:14px 6px 0;text-align:center;color:#bac9c4;font-size:12px;line-height:1.45}
    @media (max-height:760px){body{align-items:flex-start}.phone{padding-top:18px;padding-bottom:22px}.controls{padding-top:13px}.tips{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="phone" aria-label="Nokia-style automatic Snake game">
      <div class="brand"><span class="speaker"></span><span>SNAKE AUTO 3310</span><span class="speaker"></span></div>
      <div class="screen-shell"><div class="screen">
        <canvas id="game" width="240" height="248" aria-label="Automatic Snake game"></canvas>
        <div id="overlay" class="overlay hidden"><div><div class="big">LEVEL 1</div><div class="small">AUTO PLAY</div></div></div>
      </div></div>
      <div class="hud"><span id="leftHud">LEVEL 01</span><span id="rightHud">LEN 005/930</span></div>
      <div id="status" class="status">AUTO CHASE</div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="controls">
        <button id="pauseBtn" class="soft">PAUSE</button>
        <button id="speedBtn" class="soft">SPEED ×8</button>
        <button id="soundBtn" class="soft">SOUND OFF</button>
        <button id="restartBtn" class="auto-key">RESTART LEVEL</button>
      </div>
      <div class="tips">AI chases food • packs safely • fills every cell • next level starts automatically</div>
    </section>
  </main>

  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const overlay = document.getElementById('overlay');
    const leftHud = document.getElementById('leftHud');
    const rightHud = document.getElementById('rightHud');
    const statusEl = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const pauseBtn = document.getElementById('pauseBtn');
    const speedBtn = document.getElementById('speedBtn');
    const soundBtn = document.getElementById('soundBtn');
    const restartBtn = document.getElementById('restartBtn');

    const COLS = 30;
    const ROWS = 31;
    const CELL = 8;
    const W = COLS * CELL;
    const H = ROWS * CELL;
    const TOTAL = COLS * ROWS;
    const CHASE_TARGET = Math.floor(TOTAL * 0.12);
    const LCD = '#9cad6c';
    const PIXEL = '#24351f';
    const GRID = 'rgba(36,53,31,.055)';
    const SPEEDS = [2, 4, 8, 16];

    canvas.width = W;
    canvas.height = H;

    let cycle = [];
    let cycleIndex = new Map();
    let snake = [];
    let food = null;
    let chasePath = [];
    let phase = 'CHASE';
    let packingMoves = 0;
    let level = 1;
    let levelFood = 0;
    let totalFood = 0;
    let running = true;
    let transitioning = false;
    let speedIndex = 2;
    let soundOn = false;
    let audioCtx = null;
    let raf = 0;

    function key(p){ return p.x + ',' + p.y; }
    function same(a,b){ return !!a && !!b && a.x === b.x && a.y === b.y; }
    function forwardDistance(a,b){ return (b - a + TOTAL) % TOTAL; }

    function buildHamiltonianCycle(){
      const out = [];
      for(let y=0;y<ROWS;y++) out.push({x:0,y:y});

      for(let x=1;x<COLS;x++){
        if(x % 2 === 1){
          for(let y=ROWS-1;y>=1;y--) out.push({x:x,y:y});
        }else{
          for(let y=1;y<ROWS;y++) out.push({x:x,y:y});
        }
      }

      for(let x=COLS-1;x>=1;x--) out.push({x:x,y:0});

      if(out.length !== TOTAL) throw new Error('Hamiltonian cycle generation failed');
      cycle = out;
      cycleIndex = new Map();
      cycle.forEach((p,i) => cycleIndex.set(key(p), i));
    }

    function beep(freq, duration){
      if(!soundOn) return;
      try{
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.value = 0.035;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      }catch(e){}
    }

    function resetLevel(){
      transitioning = false;
      phase = 'CHASE';
      packingMoves = 0;
      levelFood = 0;
      chasePath = [];

      snake = [
        {...cycle[4]},
        {...cycle[3]},
        {...cycle[2]},
        {...cycle[1]},
        {...cycle[0]}
      ];

      spawnRandomFood();
      running = true;
      overlay.classList.add('hidden');
      pauseBtn.textContent = 'PAUSE';
      updateHud();
      draw();
    }

    function spawnRandomFood(){
      const occupied = new Set(snake.map(key));
      const free = [];
      for(const p of cycle){
        if(!occupied.has(key(p))) free.push(p);
      }
      food = free.length ? {...free[Math.floor(Math.random() * free.length)]} : null;
      chasePath = [];
    }

    function nextCycleCell(){
      const hi = cycleIndex.get(key(snake[0]));
      return {...cycle[(hi + 1) % TOTAL]};
    }

    function findSafeChasePath(){
      if(!food) return [];

      const head = snake[0];
      const tail = snake[snake.length - 1];
      const hi = cycleIndex.get(key(head));
      const ti = cycleIndex.get(key(tail));
      const fi = cycleIndex.get(key(food));

      const distanceToTail = forwardDistance(hi, ti);
      const distanceToFood = forwardDistance(hi, fi);

      if(distanceToFood <= 0 || distanceToFood >= distanceToTail) return [];
      if(snake.length < TOTAL - 1 && forwardDistance(fi, ti) <= 1) return [];

      const occupied = new Set(snake.slice(1).map(key));
      const queue = [head];
      let qIndex = 0;
      const previous = new Map();
      previous.set(key(head), null);

      const directions = [
        {x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}
      ];

      while(qIndex < queue.length){
        const current = queue[qIndex++];
        const currentOrder = forwardDistance(hi, cycleIndex.get(key(current)));

        for(const d of directions){
          const next = {x:current.x+d.x, y:current.y+d.y};
          if(next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS) continue;

          const nk = key(next);
          if(previous.has(nk) || occupied.has(nk)) continue;

          const ni = cycleIndex.get(nk);
          const nextOrder = forwardDistance(hi, ni);

          if(nextOrder <= currentOrder || nextOrder >= distanceToTail) continue;

          previous.set(nk, current);

          if(same(next, food)){
            const path = [];
            let cursor = next;

            while(!same(cursor, head)){
              path.push({...cursor});
              cursor = previous.get(key(cursor));
            }

            path.reverse();
            return path;
          }

          queue.push(next);
        }
      }

      return [];
    }

    function chooseAutoMove(){
      if(phase === 'PACK' || phase === 'FILL') return nextCycleCell();

      if(chasePath.length === 0) chasePath = findSafeChasePath();

      if(chasePath.length){
        return chasePath.shift();
      }

      return nextCycleCell();
    }

    function beginPacking(){
      phase = 'PACK';
      food = null;
      chasePath = [];
      packingMoves = snake.length;
      statusEl.textContent = 'AUTO PACKING';
    }

    function beginFill(){
      phase = 'FILL';
      food = nextCycleCell();
      statusEl.textContent = 'AUTO FILLING';
      beep(520, 0.05);
    }

    function completeLevel(){
      if(transitioning) return;
      transitioning = true;
      running = false;
      phase = 'COMPLETE';
      food = null;
      updateHud();
      draw();

      beep(880, 0.07);
      setTimeout(() => beep(1040, 0.09), 85);

      overlay.innerHTML =
        '<div><div class="big">LEVEL ' + level + ' COMPLETE</div>' +
        '<div class="small">SCREEN FILLED 100%<br>NEXT LEVEL STARTING...</div></div>';
      overlay.classList.remove('hidden');
      statusEl.textContent = 'LEVEL COMPLETE';

      setTimeout(() => {
        level++;
        resetLevel();
      }, 900);
    }

    function emergencyMove(){
      const head = snake[0];
      const occupied = new Set(snake.map(key));
      const directions = [
        {x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}
      ];

      for(const d of directions){
        const p = {x:head.x+d.x,y:head.y+d.y};
        if(p.x>=0 && p.x<COLS && p.y>=0 && p.y<ROWS && !occupied.has(key(p))) return p;
      }
      return null;
    }

    function moveOneStep(){
      if(!running || transitioning) return;

      let next = chooseAutoMove();
      const occupied = new Set(snake.map(key));

      if(!next || next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS || occupied.has(key(next))){
        next = emergencyMove();
        chasePath = [];
      }

      if(!next){
        restartAfterFault();
        return;
      }

      snake.unshift(next);

      const ate = food && same(next, food);

      if(ate){
        levelFood++;
        totalFood++;
        chasePath = [];
        beep(700, 0.025);

        if(snake.length >= TOTAL){
          updateHud();
          completeLevel();
          return;
        }

        if(phase === 'CHASE' && snake.length >= CHASE_TARGET){
          beginPacking();
        }else if(phase === 'FILL'){
          food = nextCycleCell();
        }else{
          spawnRandomFood();
        }
      }else{
        snake.pop();

        if(phase === 'PACK'){
          packingMoves--;
          if(packingMoves <= 0) beginFill();
        }
      }
    }

    function restartAfterFault(){
      running = false;
      transitioning = true;
      overlay.innerHTML =
        '<div><div class="big">RECOVERING</div><div class="small">AUTO RESTART</div></div>';
      overlay.classList.remove('hidden');

      setTimeout(() => resetLevel(), 400);
    }

    function effectiveMovesPerFrame(){
      return SPEEDS[speedIndex] + Math.min(6, Math.floor((level - 1) / 2));
    }

    function gameLoop(){
      if(running && !transitioning){
        const moves = effectiveMovesPerFrame();
        for(let i=0;i<moves;i++){
          moveOneStep();
          if(!running || transitioning) break;
        }
        updateHud();
        draw();
      }
      raf = requestAnimationFrame(gameLoop);
    }

    function updateHud(){
      leftHud.textContent =
        'LEVEL ' + String(level).padStart(2,'0') +
        '  FOOD ' + String(levelFood).padStart(3,'0');

      rightHud.textContent =
        'LEN ' + String(snake.length).padStart(3,'0') + '/' + TOTAL;

      const pct = (snake.length / TOTAL) * 100;
      progressBar.style.width = pct.toFixed(1) + '%';

      if(phase === 'CHASE') statusEl.textContent = 'AUTO CHASE';
      if(phase === 'PACK') statusEl.textContent = 'AUTO PACKING';
      if(phase === 'FILL') statusEl.textContent = 'AUTO FILLING';
    }

    function drawGrid(){
      ctx.strokeStyle = GRID;
      ctx.lineWidth = 1;

      for(let x=0;x<=W;x+=CELL){
        ctx.beginPath();
        ctx.moveTo(x+.5,0);
        ctx.lineTo(x+.5,H);
        ctx.stroke();
      }

      for(let y=0;y<=H;y+=CELL){
        ctx.beginPath();
        ctx.moveTo(0,y+.5);
        ctx.lineTo(W,y+.5);
        ctx.stroke();
      }
    }

    function drawSnakePixel(p, head){
      const px = p.x * CELL;
      const py = p.y * CELL;

      ctx.fillStyle = PIXEL;
      ctx.fillRect(px+1, py+1, CELL-2, CELL-2);

      if(head){
        ctx.fillStyle = LCD;
        ctx.fillRect(px+2, py+2, 1, 1);
        ctx.fillRect(px+5, py+2, 1, 1);
      }
    }

    function drawFood(){
      if(!food) return;
      const px = food.x * CELL;
      const py = food.y * CELL;

      ctx.fillStyle = PIXEL;
      ctx.fillRect(px+2, py+1, 4, 6);
      ctx.fillRect(px+1, py+2, 6, 4);

      ctx.fillStyle = LCD;
      ctx.fillRect(px+3, py+3, 2, 2);
    }

    function draw(){
      ctx.fillStyle = LCD;
      ctx.fillRect(0,0,W,H);
      drawGrid();
      drawFood();

      for(let i=snake.length-1;i>=0;i--){
        drawSnakePixel(snake[i], i===0);
      }

      ctx.strokeStyle = PIXEL;
      ctx.lineWidth = 2;
      ctx.strokeRect(1,1,W-2,H-2);
    }

    pauseBtn.addEventListener('click', () => {
      if(transitioning) return;
      running = !running;
      pauseBtn.textContent = running ? 'PAUSE' : 'RESUME';

      if(running){
        overlay.classList.add('hidden');
      }else{
        overlay.innerHTML =
          '<div><div class="big">PAUSED</div><div class="small">PRESS RESUME</div></div>';
        overlay.classList.remove('hidden');
      }
    });

    speedBtn.addEventListener('click', () => {
      speedIndex = (speedIndex + 1) % SPEEDS.length;
      speedBtn.textContent = 'SPEED ×' + SPEEDS[speedIndex];
      beep(560,0.03);
    });

    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      soundBtn.textContent = soundOn ? 'SOUND ON' : 'SOUND OFF';
      if(soundOn) beep(650,0.04);
    });

    restartBtn.addEventListener('click', () => {
      resetLevel();
    });

    document.addEventListener('visibilitychange', () => {
      if(document.hidden && running && !transitioning){
        running = false;
        pauseBtn.textContent = 'RESUME';
        overlay.innerHTML =
          '<div><div class="big">PAUSED</div><div class="small">RETURNED FROM BACKGROUND<br>PRESS RESUME</div></div>';
        overlay.classList.remove('hidden');
      }
    });

    buildHamiltonianCycle();
    resetLevel();
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(gameLoop);
  })();
  </script>
</body>
</html>
