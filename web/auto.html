<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#23453d" />
  <title>Snake 3310 Auto</title>
  <style>
    :root{
      --phone:#355d54;--phone-dark:#183b35;--phone-light:#6b8f86;
      --screen:#9cad6c;--pixel:#24351f;--screen-edge:#172d29;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#101615;font-family:Arial,Helvetica,sans-serif;color:white;overscroll-behavior:none}
    body{display:flex;justify-content:center;align-items:center;padding:18px}
    .wrap{width:min(94vw,430px)}
    .phone{position:relative;background:linear-gradient(145deg,var(--phone-light),var(--phone) 40%,var(--phone-dark));border-radius:42px 42px 58px 58px;padding:28px 25px 34px;box-shadow:0 20px 60px #0009,inset 0 0 0 3px #88a79f22,inset 0 -10px 22px #0003;border:2px solid #75958d66}
    .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px;color:#e8f0e8;font-weight:800;letter-spacing:.19em;font-size:13px;text-shadow:0 1px #000}
    .speaker{width:38px;height:5px;border-radius:999px;background:#122e29;box-shadow:inset 0 1px 1px #0008}
    .screen-shell{background:var(--screen-edge);padding:12px;border-radius:14px 14px 28px 28px;box-shadow:inset 0 0 12px #000b,0 2px 1px #9bb7af44}
    .screen{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--screen);border:3px solid #566846;box-shadow:inset 0 0 22px #4f603c55;image-rendering:pixelated}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#9cad6cee;color:var(--pixel);font-family:monospace;font-weight:900;text-align:center;padding:20px;z-index:2}
    .overlay.hidden{display:none}
    .overlay .big{font-size:22px;letter-spacing:.05em;margin-bottom:8px}
    .overlay .small{font-size:12px;line-height:1.45}
    .hud{display:flex;justify-content:space-between;margin:8px 2px 0;font-family:monospace;font-weight:900;color:#dce7dc;font-size:12px;text-shadow:0 1px #000;gap:8px}
    .status{text-align:center;min-height:18px;margin-top:5px;font-family:monospace;font-size:12px;color:#dce7dc;font-weight:800}
    .progress{height:6px;margin:7px 3px 0;border-radius:10px;background:#183b35;overflow:hidden;box-shadow:inset 0 1px 2px #0008}
    .progress>div{height:100%;width:0;background:#cbd8c9;transition:width .08s linear}
    .controls{padding-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    button{font:inherit;color:#eef5ef;user-select:none;touch-action:manipulation}
    .soft{height:44px;border-radius:18px 18px 28px 28px;border:1px solid #79968f66;background:linear-gradient(#52756d,#2a4943);box-shadow:inset 0 2px 2px #ffffff22,0 3px 4px #0007;font-weight:800;font-size:11px;letter-spacing:.04em}
    .soft:active{transform:translateY(2px);box-shadow:inset 0 2px 5px #0008}
    .tips{margin:14px 6px 0;text-align:center;color:#bac9c4;font-size:12px;line-height:1.45}
    @media (max-height:760px){body{align-items:flex-start}.phone{padding-top:18px;padding-bottom:22px}.controls{padding-top:13px}.tips{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="phone" aria-label="Nokia-style automatic Snake game">
      <div class="brand"><span class="speaker"></span><span>SNAKE AUTO 3310</span><span class="speaker"></span></div>
      <div class="screen-shell"><div class="screen">
        <canvas id="game" width="240" height="240" aria-label="Automatic Snake game"></canvas>
        <div id="overlay" class="overlay hidden"><div><div class="big">LEVEL 1</div><div class="small">AUTO PLAY</div></div></div>
      </div></div>

      <div class="hud">
        <span id="leftHud">LEVEL 01</span>
        <span id="rightHud">LEN 005/900</span>
      </div>

      <div id="status" class="status">AUTO HUNT</div>
      <div class="progress"><div id="progressBar"></div></div>

      <div class="controls">
        <button id="pauseBtn" class="soft">PAUSE</button>
        <button id="soundBtn" class="soft">SOUND OFF</button>
        <button id="restartBtn" class="soft">RESTART</button>
      </div>

      <div class="tips">Random food • safe shortcuts • obstacle levels • automatic next level</div>
    </section>
  </main>

  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    const overlay = document.getElementById('overlay');
    const leftHud = document.getElementById('leftHud');
    const rightHud = document.getElementById('rightHud');
    const statusEl = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const pauseBtn = document.getElementById('pauseBtn');
    const soundBtn = document.getElementById('soundBtn');
    const restartBtn = document.getElementById('restartBtn');

    const COLS = 30;
    const ROWS = 30;
    const CELL = 8;
    const W = COLS * CELL;
    const H = ROWS * CELL;
    const MACRO_W = COLS / 2;
    const MACRO_H = ROWS / 2;

    const LCD = '#9cad6c';
    const PIXEL = '#24351f';
    const GRID = 'rgba(36,53,31,.055)';

    canvas.width = W;
    canvas.height = H;

    const OBSTACLE_GROUPS = [
      [[7,7]],
      [[3,4]],
      [[10,10],[11,10]],
      [[11,3],[11,4]],
      [[4,11],[5,11]],
      [[6,3],[7,3],[8,3]],
      [[2,8],[2,9]],
      [[9,12],[10,12]],
      [[12,6],[12,7],[12,8]],
      [[5,6],[5,7]],
      [[8,4],[9,4]],
      [[3,12],[4,12],[5,12]]
    ];

    let level = 1;
    let snake = [];
    let food = null;
    let obstacles = new Set();
    let cycle = [];
    let cycleIndex = new Map();
    let running = true;
    let transitioning = false;
    let timer = null;
    let soundOn = false;
    let audioCtx = null;
    let foodCount = 0;

    function cellKey(x, y){ return x + ',' + y; }
    function pointKey(p){ return cellKey(p.x, p.y); }
    function macroKey(x, y){ return x + ':' + y; }

    function parseCellKey(k){
      const parts = k.split(',');
      return {x:Number(parts[0]), y:Number(parts[1])};
    }

    function seededRandom(seed){
      let s = seed >>> 0;
      return () => {
        s ^= s << 13;
        s ^= s >>> 17;
        s ^= s << 5;
        return ((s >>> 0) / 4294967296);
      };
    }

    function shuffle(arr, rnd){
      for(let i=arr.length-1;i>0;i--){
        const j = Math.floor(rnd() * (i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
      return arr;
    }

    function levelDelay(){
      return Math.max(72, Math.round(122 - (level - 1) * 1.5));
    }

    function obstacleMacrosForLevel(){
      const blocked = new Set();
      if(level < 4) return blocked;

      const stages = Math.min(OBSTACLE_GROUPS.length, level - 3);

      for(let i=0;i<stages;i++){
        for(const [x,y] of OBSTACLE_GROUPS[i]){
          blocked.add(macroKey(x,y));
        }
      }

      return blocked;
    }

    function addEdge(adj, a, b){
      const ak = pointKey(a);
      const bk = pointKey(b);
      if(!adj.has(ak)) adj.set(ak,new Set());
      if(!adj.has(bk)) adj.set(bk,new Set());
      adj.get(ak).add(bk);
      adj.get(bk).add(ak);
    }

    function removeEdge(adj, a, b){
      const ak = pointKey(a);
      const bk = pointKey(b);
      if(adj.has(ak)) adj.get(ak).delete(bk);
      if(adj.has(bk)) adj.get(bk).delete(ak);
    }

    function buildLevelCycle(){
      const blockedMacros = obstacleMacrosForLevel();
      obstacles = new Set();

      for(const mk of blockedMacros){
        const [mx,my] = mk.split(':').map(Number);
        for(let oy=0;oy<2;oy++){
          for(let ox=0;ox<2;ox++){
            obstacles.add(cellKey(mx*2+ox,my*2+oy));
          }
        }
      }

      const active = [];
      for(let my=0;my<MACRO_H;my++){
        for(let mx=0;mx<MACRO_W;mx++){
          if(!blockedMacros.has(macroKey(mx,my))) active.push({x:mx,y:my});
        }
      }

      const activeSet = new Set(active.map(m=>macroKey(m.x,m.y)));
      const rnd = seededRandom(0x3310 + level * 7919);
      const start = active[Math.floor(rnd()*active.length)];
      const visited = new Set([macroKey(start.x,start.y)]);
      const stack = [start];
      const treeEdges = [];

      while(stack.length){
        const current = stack[stack.length-1];
        const options = [
          {x:current.x+1,y:current.y},
          {x:current.x-1,y:current.y},
          {x:current.x,y:current.y+1},
          {x:current.x,y:current.y-1}
        ].filter(n =>
          n.x>=0 && n.x<MACRO_W &&
          n.y>=0 && n.y<MACRO_H &&
          activeSet.has(macroKey(n.x,n.y)) &&
          !visited.has(macroKey(n.x,n.y))
        );

        shuffle(options,rnd);

        if(!options.length){
          stack.pop();
          continue;
        }

        const next = options[0];
        visited.add(macroKey(next.x,next.y));
        treeEdges.push([current,next]);
        stack.push(next);
      }

      if(visited.size !== active.length){
        throw new Error('Obstacle layout disconnected the board');
      }

      const adj = new Map();

      for(const m of active){
        const a={x:m.x*2,y:m.y*2};
        const b={x:m.x*2+1,y:m.y*2};
        const c={x:m.x*2+1,y:m.y*2+1};
        const d={x:m.x*2,y:m.y*2+1};
        addEdge(adj,a,b);
        addEdge(adj,b,c);
        addEdge(adj,c,d);
        addEdge(adj,d,a);
      }

      for(const [m1,m2] of treeEdges){
        if(m1.y === m2.y){
          const left = m1.x < m2.x ? m1 : m2;
          const right = m1.x < m2.x ? m2 : m1;
          const y = left.y * 2;

          const b={x:left.x*2+1,y:y};
          const c={x:left.x*2+1,y:y+1};
          const aR={x:right.x*2,y:y};
          const dR={x:right.x*2,y:y+1};

          removeEdge(adj,b,c);
          removeEdge(adj,aR,dR);
          addEdge(adj,b,aR);
          addEdge(adj,c,dR);
        }else{
          const top = m1.y < m2.y ? m1 : m2;
          const bottom = m1.y < m2.y ? m2 : m1;
          const x = top.x * 2;

          const d={x:x,y:top.y*2+1};
          const c={x:x+1,y:top.y*2+1};
          const aB={x:x,y:bottom.y*2};
          const bB={x:x+1,y:bottom.y*2};

          removeEdge(adj,c,d);
          removeEdge(adj,aB,bB);
          addEdge(adj,d,aB);
          addEdge(adj,c,bB);
        }
      }

      const expected = active.length * 4;
      const startKey = adj.keys().next().value;
      const built = [];
      let previous = null;
      let current = startKey;

      do{
        built.push(parseCellKey(current));
        const ns = [...adj.get(current)];
        if(ns.length !== 2) throw new Error('Invalid cycle degree');
        const next = ns[0] !== previous ? ns[0] : ns[1];
        previous = current;
        current = next;

        if(built.length > expected + 1) throw new Error('Cycle overflow');
      }while(current !== startKey);

      if(built.length !== expected){
        throw new Error('Cycle length mismatch');
      }

      cycle = built;
      cycleIndex = new Map();
      cycle.forEach((p,i)=>cycleIndex.set(pointKey(p),i));
    }

    function forwardDistance(a,b){
      return (b - a + cycle.length) % cycle.length;
    }

    function gridNeighbors(p){
      const out = [];
      if(p.x>0) out.push({x:p.x-1,y:p.y});
      if(p.x<COLS-1) out.push({x:p.x+1,y:p.y});
      if(p.y>0) out.push({x:p.x,y:p.y-1});
      if(p.y<ROWS-1) out.push({x:p.x,y:p.y+1});
      return out;
    }

    function spawnFood(){
      const occupied = new Set(snake.map(pointKey));
      const free = cycle.filter(p=>!occupied.has(pointKey(p)));

      if(!free.length){
        food = null;
        completeLevel();
        return;
      }

      food = {...free[Math.floor(Math.random()*free.length)]};
    }

    function bfsPath(start, target, blocked){
      const startKey = pointKey(start);
      const targetKey = pointKey(target);
      const queue = [start];
      const previous = new Map([[startKey, null]]);
      let index = 0;

      while(index < queue.length){
        const current = queue[index++];

        if(pointKey(current) === targetKey){
          const path = [];
          let cursorKey = targetKey;

          while(cursorKey !== startKey){
            const p = parseCellKey(cursorKey);
            path.push(p);
            cursorKey = previous.get(cursorKey);
          }

          path.reverse();
          return path;
        }

        for(const next of gridNeighbors(current)){
          const nk = pointKey(next);

          if(previous.has(nk)) continue;
          if(obstacles.has(nk)) continue;
          if(blocked.has(nk) && nk !== targetKey) continue;

          previous.set(nk, pointKey(current));
          queue.push(next);
        }
      }

      return [];
    }

    function simulateFoodPath(path){
      if(!path.length) return null;

      const body = snake.map(p=>({...p}));

      for(let i=0;i<path.length;i++){
        const next = path[i];
        const eating = i === path.length - 1;
        const blockedBody = new Set(
          (eating ? body : body.slice(0,-1)).map(pointKey)
        );

        if(obstacles.has(pointKey(next)) || blockedBody.has(pointKey(next))){
          return null;
        }

        body.unshift({...next});

        if(!eating){
          body.pop();
        }
      }

      return body;
    }

    function bodyCanReachTail(body){
      if(body.length < 3) return true;

      const head = body[0];
      const tail = body[body.length-1];
      const blocked = new Set(
        body.slice(1,-1).map(pointKey)
      );

      const escapePath = bfsPath(head, tail, blocked);
      return escapePath.length > 0;
    }

    function shortestSafeFoodPath(){
      if(!food) return [];

      const blocked = new Set(
        snake.slice(0,-1).map(pointKey)
      );

      const direct = bfsPath(snake[0], food, blocked);

      if(!direct.length) return [];

      const simulated = simulateFoodPath(direct);

      if(simulated && bodyCanReachTail(simulated)){
        return direct;
      }

      return [];
    }

    function chooseMove(){
      const directPath = shortestSafeFoodPath();

      if(directPath.length){
        return directPath[0];
      }

      const head = snake[0];
      const hi = cycleIndex.get(pointKey(head));
      const next = cycle[(hi+1)%cycle.length];

      return {...next};
    }

    function same(a,b){
      return !!a && !!b && a.x===b.x && a.y===b.y;
    }

    function step(){
      clearTimeout(timer);

      if(!running || transitioning) return;

      const next = chooseMove();
      const willEat = same(next,food);
      const blockedBody = new Set((willEat ? snake : snake.slice(0,-1)).map(pointKey));

      if(blockedBody.has(pointKey(next)) || obstacles.has(pointKey(next))){
        recoverLevel();
        return;
      }

      snake.unshift(next);

      if(willEat){
        foodCount++;
        beep(720,0.03);

        if(snake.length >= cycle.length){
          updateHud();
          draw();
          completeLevel();
          return;
        }

        spawnFood();
      }else{
        snake.pop();
      }

      updateHud();
      draw();
      timer = setTimeout(step,levelDelay());
    }

    function beep(freq,duration){
      if(!soundOn) return;

      try{
        audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
        const o=audioCtx.createOscillator();
        const g=audioCtx.createGain();
        o.type='square';
        o.frequency.value=freq;
        g.gain.value=.035;
        o.connect(g);
        g.connect(audioCtx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
        o.stop(audioCtx.currentTime+duration);
      }catch(e){}
    }

    function startLevel(){
      clearTimeout(timer);
      transitioning = false;
      running = true;
      foodCount = 0;

      buildLevelCycle();

      snake = [
        {...cycle[4]},
        {...cycle[3]},
        {...cycle[2]},
        {...cycle[1]},
        {...cycle[0]}
      ];

      spawnFood();
      overlay.classList.add('hidden');
      pauseBtn.textContent='PAUSE';

      updateHud();
      draw();

      timer=setTimeout(step,350);
    }

    function completeLevel(){
      if(transitioning) return;

      transitioning = true;
      running = false;
      clearTimeout(timer);
      food = null;

      beep(900,.08);
      setTimeout(()=>beep(1080,.1),100);

      overlay.innerHTML =
        '<div><div class="big">LEVEL ' + level + ' COMPLETE</div>' +
        '<div class="small">AREA FILLED 100%<br>NEXT LEVEL...</div></div>';

      overlay.classList.remove('hidden');
      statusEl.textContent='LEVEL COMPLETE';

      setTimeout(()=>{
        level++;
        startLevel();
      },1200);
    }

    function recoverLevel(){
      transitioning = true;
      running = false;
      clearTimeout(timer);

      overlay.innerHTML =
        '<div><div class="big">RECOVERING</div>' +
        '<div class="small">REBUILDING SAFE ROUTE</div></div>';

      overlay.classList.remove('hidden');
      statusEl.textContent='RECOVERING';

      setTimeout(()=>startLevel(),650);
    }

    function updateHud(){
      const obstacleCells = obstacles.size;
      const total = cycle.length;

      leftHud.textContent =
        'LEVEL ' + String(level).padStart(2,'0') +
        (obstacleCells ? '  WALL ' + String(obstacleCells).padStart(2,'0') : '');

      rightHud.textContent =
        'LEN ' + String(snake.length).padStart(3,'0') + '/' + total;

      progressBar.style.width =
        ((snake.length/total)*100).toFixed(1)+'%';

      statusEl.textContent =
        obstacleCells ? 'AUTO HUNT • OBSTACLES' : 'AUTO HUNT';
    }

    function drawGrid(){
      ctx.strokeStyle=GRID;
      ctx.lineWidth=1;

      for(let x=0;x<=W;x+=CELL){
        ctx.beginPath();
        ctx.moveTo(x+.5,0);
        ctx.lineTo(x+.5,H);
        ctx.stroke();
      }

      for(let y=0;y<=H;y+=CELL){
        ctx.beginPath();
        ctx.moveTo(0,y+.5);
        ctx.lineTo(W,y+.5);
        ctx.stroke();
      }
    }

    function drawObstacleCell(x,y){
      const px=x*CELL;
      const py=y*CELL;

      ctx.fillStyle=PIXEL;
      ctx.fillRect(px+1,py+1,CELL-2,CELL-2);

      ctx.fillStyle=LCD;
      ctx.fillRect(px+3,py+3,2,2);
    }

    function drawSnakePixel(p,head){
      const px=p.x*CELL;
      const py=p.y*CELL;

      ctx.fillStyle=PIXEL;
      ctx.fillRect(px+1,py+1,CELL-2,CELL-2);

      if(head){
        ctx.fillStyle=LCD;
        ctx.fillRect(px+2,py+2,1,1);
        ctx.fillRect(px+5,py+2,1,1);
      }
    }

    function drawFood(){
      if(!food) return;

      const px=food.x*CELL;
      const py=food.y*CELL;

      ctx.fillStyle=PIXEL;
      ctx.fillRect(px+2,py+1,4,6);
      ctx.fillRect(px+1,py+2,6,4);

      ctx.fillStyle=LCD;
      ctx.fillRect(px+3,py+3,2,2);
    }

    function draw(){
      ctx.fillStyle=LCD;
      ctx.fillRect(0,0,W,H);

      drawGrid();

      for(const k of obstacles){
        const p=parseCellKey(k);
        drawObstacleCell(p.x,p.y);
      }

      drawFood();

      for(let i=snake.length-1;i>=0;i--){
        drawSnakePixel(snake[i],i===0);
      }

      ctx.strokeStyle=PIXEL;
      ctx.lineWidth=2;
      ctx.strokeRect(1,1,W-2,H-2);
    }

    pauseBtn.addEventListener('click',()=>{
      if(transitioning) return;

      running=!running;
      pauseBtn.textContent=running?'PAUSE':'RESUME';

      if(running){
        overlay.classList.add('hidden');
        timer=setTimeout(step,levelDelay());
      }else{
        clearTimeout(timer);
        overlay.innerHTML=
          '<div><div class="big">PAUSED</div><div class="small">PRESS RESUME</div></div>';
        overlay.classList.remove('hidden');
      }
    });

    soundBtn.addEventListener('click',()=>{
      soundOn=!soundOn;
      soundBtn.textContent=soundOn?'SOUND ON':'SOUND OFF';
      if(soundOn) beep(650,.04);
    });

    restartBtn.addEventListener('click',()=>{
      startLevel();
    });

    document.addEventListener('visibilitychange',()=>{
      if(document.hidden && running && !transitioning){
        running=false;
        clearTimeout(timer);
        pauseBtn.textContent='RESUME';
        overlay.innerHTML=
          '<div><div class="big">PAUSED</div><div class="small">PRESS RESUME</div></div>';
        overlay.classList.remove('hidden');
      }
    });

    startLevel();
  })();
  </script>
</body>
</html>
