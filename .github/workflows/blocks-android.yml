name: Build BLOCKS Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "blocks-android/**"
      - "web/blocks.html"
      - ".github/workflows/blocks-android.yml"

permissions:
  contents: write

jobs:
  build-blocks-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Include offline game
        shell: bash
        run: |
          mkdir -p blocks-android/app/src/main/assets
          cp web/blocks.html blocks-android/app/src/main/assets/blocks.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: blocks-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: cp blocks-android/app/build/outputs/apk/debug/app-debug.apk BLOCKS.apk

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOCKS-Android-APK
          path: BLOCKS.apk
          retention-days: 90
          if-no-files-found: error

      - name: Publish Android download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view blocks-android-v1 >/dev/null 2>&1 || gh release create blocks-android-v1 --title "BLOCKS Android" --notes "Install BLOCKS.apk on Android to play the retro falling-block game. Debug-signed APK for testing; includes an offline fallback."
          gh release upload blocks-android-v1 BLOCKS.apk --clobber
